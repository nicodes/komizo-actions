name: Publish config image
description: >
  Publish this commit's compose.yml — and optionally its reverse-proxy routes —
  as a container image the host extracts at deploy time.

  This is what lets a compose.yml change ship on merge without giving the
  deploy user write access to the host. The file travels as a registry layer
  that root unpacks, so altering what runs still requires registry push — which
  already implied code execution on the box. Copying compose.yml to the host
  instead would make the deploy key root-equivalent, because that file can
  grant a container the host filesystem.

  Each file is named explicitly rather than a directory being swept up, so the
  contents of the image are exactly what the workflow lists. Nothing can ride
  along: a stray key or a second environment's config in the same folder is not
  published, because it was not named.

  Assumes you have already authenticated to the registry, e.g. with
  docker/login-action.

inputs:
  config:
    description: >
      Path to this app's komizo.yml — a single manifest naming the compose file
      and the hostnames it answers on. When set, it replaces the compose: and
      hostnames: inputs below (pass one form or the other, not both).

      Shape:

          compose: compose.yml          # relative to this file
          hostnames:
            - app.example.com
            - name: api.example.com
              container: api            # DISPLAY label only
            - name: "*.preview.example.com"
              container: api
              tls: on-demand

      It is read here in CI and turned into the same /config/compose.yml and
      /config/hostnames the host has always read, so nothing on the box learns a
      new format.
    required: false
    default: ""
  compose:
    description: >
      Path to this app's compose file. Published as /config/compose.yml, which
      is where the host looks, so the name on disk does not matter — point it at
      compose.prod.yml if that is what you have. Ignored when config: is given.
    required: false
    default: ""
  hostnames:
    description: >
      Path to a file listing the hostnames this app answers on, one per line,
      `#` comments allowed. Published as /config/hostnames.

      A line may say which container serves the name:

          api.example.com -> api

      That is read for DISPLAY only — the host generates the route from the
      name alone, so a wrong arrow mislabels a chart and cannot misroute a
      request. It exists because nothing on the server can work it out: the
      shared proxy only ever talks to your gateway, and which container answers
      is decided inside it.

      This is the WHOLE of what an app tells the server about routing. The host
      generates the reverse-proxy config from it and points every one of these
      names at your app's gateway container — so an app cannot author server
      config, and no app's mistake can be another app's outage.

      Everything a request meets after the hostname match belongs to your
      gateway: paths, headers, static files, which service answers what. That is
      a whole config in an image you built, not a fragment of a file shared with
      strangers.

      Leave empty for an app nothing outside reaches — a worker, a queue
      consumer, a cron job.
    required: false
    default: ""
  image:
    description: >
      Image reference WITHOUT a tag, e.g. ghcr.io/you/myapp-config. Must
      match the CONFIG_IMAGE the host was bootstrapped with.
    required: true
  tag:
    description: Tag to publish, normally the commit SHA.
    required: true

outputs:
  image-ref:
    description: >
      Full reference of the pushed image, INCLUDING the tag — unlike the
      `image` input, which must not carry one.
    value: ${{ steps.push.outputs.image-ref }}

runs:
  using: composite
  steps:
    - name: Build and push the config image
      id: push
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        COMPOSE_INPUT: ${{ inputs.compose }}
        HOSTNAMES_INPUT: ${{ inputs.hostnames }}
        IMAGE: ${{ inputs.image }}
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail

        # A tag is a colon AFTER the last slash. Testing the whole string would
        # reject a registry with a port, e.g. registry.internal:5000/app-config.
        case "$IMAGE" in
          *@*)
            echo "::error::image must not include a digest (got '$IMAGE'); pass a tag separately."
            exit 1
            ;;
        esac
        case "${IMAGE##*/}" in
          *:*)
            echo "::error::image must not include a tag (got '$IMAGE'); pass the tag separately."
            exit 1
            ;;
        esac
        case "$TAG" in
          ""|*[!A-Za-z0-9._-]*)
            echo "::error::tag must be a plain image tag (letters, digits, dot, underscore, hyphen); got '$TAG'."
            exit 1
            ;;
        esac
        # A registry reference and nothing else -- a newline here would forge a
        # second line in the `image-ref` output written at the end of this step.
        case "$IMAGE" in
          ""|*[!A-Za-z0-9._:/-]*)
            echo "::error::image contains characters not valid in an image reference: '$IMAGE'."
            exit 1
            ;;
        esac

        # Staged into a directory of our own rather than built from wherever the
        # files happen to live. Two reasons: the host looks for fixed names
        # (/config/compose.yml), and building from the repo would sweep in every
        # neighbouring file — which is exactly what naming them explicitly is
        # meant to prevent.
        stage="$RUNNER_TEMP/komizo-config"
        rm -rf "$stage"
        mkdir -p "$stage"

        # Confine each named file to the checked-out workspace, following no
        # symlinks. `-f` and `cp` both follow symlinks and neither is bounded to
        # the repo, so a ref carrying `deploy/compose.yml -> ~/.ssh/id_deploy`
        # (or a symlinked directory anywhere in the path) would publish the
        # deploy KEY as a public layer of this image. Explicit naming stops the
        # directory sweep but not the symlink -- this does. Called as a plain
        # statement, never in $(...): its `exit` must terminate the step, and an
        # exit inside a command substitution only leaves the subshell.
        confine() {
          local label="$1" path="$2" resolved root
          if [ -L "$path" ]; then
            echo "::error::$label '$path' is a symlink; refusing to follow it out of the workspace."
            exit 1
          fi
          if ! resolved="$(realpath -e "$path" 2>/dev/null)"; then
            echo "::error::$label '$path' does not exist. It is a path in your repository, relative to the workspace — did the checkout run?"
            exit 1
          fi
          root="$(realpath -e "$GITHUB_WORKSPACE" 2>/dev/null || printf '%s' "${GITHUB_WORKSPACE:-}")"
          case "$resolved" in
            "$root"/*) ;;
            *)
              echo "::error::$label '$path' resolves to '$resolved', which is outside the workspace ($root); only checked-out files can be published."
              exit 1 ;;
          esac
        }

        # Resolve the source: either a komizo.yml manifest, or the explicit
        # compose:/hostnames: inputs. Exactly one form -- config: is the newer,
        # structured one; the file inputs still work for apps that use them.
        if [ -n "$CONFIG" ] && [ -n "$COMPOSE_INPUT" ]; then
          echo "::error::pass either config: (a komizo.yml) or compose:, not both."
          exit 1
        fi
        HOSTNAMES_DERIVED=0
        if [ -n "$CONFIG" ]; then
          confine "config file" "$CONFIG"
          # No install fallback here. This step holds the deploy key and the
          # registry token, and it used to reach out to PyPI for an unpinned
          # package -- escalating to `sudo apt-get` if that failed -- which made
          # the least verified thing in the pipeline something that ran on every
          # deploy. GitHub-hosted runners ship PyYAML; parse-config.py says what
          # to do when it is genuinely missing.
          #
          # Turn komizo.yml into the flat hostnames the host reads, and hand back
          # the compose path it names. The derived file is ours, so it is not
          # confined below (it lives in RUNNER_TEMP, not the workspace) -- but it
          # still goes through the same validation and the host re-checks it.
          HOSTNAMES="$RUNNER_TEMP/komizo-hostnames"
          : > "$HOSTNAMES"
          if ! COMPOSE="$(python3 "$GITHUB_ACTION_PATH/parse-config.py" "$CONFIG" "$HOSTNAMES")"; then
            exit 1
          fi
          HOSTNAMES_DERIVED=1
          # An app with no hostnames (a worker) publishes none.
          [ -s "$HOSTNAMES" ] || HOSTNAMES=""
        else
          COMPOSE="$COMPOSE_INPUT"
          HOSTNAMES="$HOSTNAMES_INPUT"
        fi
        if [ -z "$COMPOSE" ]; then
          echo "::error::no compose file. Pass config: (a komizo.yml) or compose:."
          exit 1
        fi

        confine "compose file" "$COMPOSE"
        if [ ! -f "$COMPOSE" ]; then
          echo "::error::compose file '$COMPOSE' does not exist. It is a path in your repository, relative to the workspace — did the checkout run?"
          exit 1
        fi
        cp "$COMPOSE" "$stage/compose.yml"
        included="compose.yml <- $COMPOSE"

        if [ -n "$HOSTNAMES" ]; then
          # The derived file is ours and lives outside the workspace; only an
          # app-supplied path needs confining.
          if [ "$HOSTNAMES_DERIVED" = "0" ]; then
            confine "hostnames file" "$HOSTNAMES"
          fi
          if [ ! -f "$HOSTNAMES" ]; then
            echo "::error::hostnames file '$HOSTNAMES' does not exist. It is a path in your repository, relative to the workspace."
            exit 1
          fi
          # Checked here as well as on the host. The host is the one that has to
          # refuse a bad name -- it writes them into a config the whole box
          # loads -- but finding out in CI, before anything is published, is
          # cheaper than finding out from a deploy that reverted.
          # Trimmed by parameter expansion, never with xargs and never by word
          # splitting.
          #
          # xargs PARSES its input: it honours quotes and backslashes and fails
          # on an unmatched one. With `|| true` after it that failure became an
          # EMPTY line, which this loop skips -- so a hostname containing a
          # quote was silently dropped here and shipped anyway, to a host whose
          # awk has no such notion and rejects it for real. CI and the host
          # disagreeing about which lines exist is the one thing this check
          # must not do.
          #
          # Unquoted word splitting would have the same class of problem from
          # the other end: every wildcard hostname starts with '*', and an
          # unquoted expansion in a workspace full of files is a glob.
          trim() {
            local s="$1"
            s="${s#"${s%%[![:space:]]*}"}"
            s="${s%"${s##*[![:space:]]}"}"
            printf '%s' "$s"
          }
          bad=""
          n=0
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%%#*}"
            line="$(trim "$line")"
            [ -n "$line" ] || continue
            # A line may say where the name goes -- "api.example.com -> api".
            # Only the NAME is validated: the rest is a label for the interface
            # and never reaches any config. Splitting here rather than rejecting
            # the line is the whole difference between an annotation and a
            # syntax error.
            name="${line%% *}"
            rest="$(trim "${line#"$name"}")"
            # An optional trailing keyword says how the name's certificate is
            # obtained. Taken off the end first so what remains is the arrow, if
            # any -- the two are independent, and either can appear alone.
            #
            # Validated for SHAPE only. Which modes a server can actually serve
            # is the host's business and it refuses the ones it cannot, with a
            # message naming the file it came from. Deciding that here would put
            # the answer in the wrong place and date it to whenever this action
            # was last released.
            case "$rest" in
              *' on-demand'|*' dns'|*' passthrough'|on-demand|dns|passthrough)
                rest="$(trim "${rest% *}")"
                case "$rest" in on-demand|dns|passthrough) rest="" ;; esac ;;
            esac
            case "$rest" in
              '') ;;
              '->'*)
                svc="$(trim "${rest#->}")"
                case "$svc" in
                  ''|*[!A-Za-z0-9_-]*)
                    echo "::error::'$line' names no valid container after '->'. Use a compose service name: letters, digits, underscore, hyphen."
                    exit 1 ;;
                esac ;;
              *)
                echo "::error::'$line' has something after the hostname that is not '-> <container>', optionally followed by one of: on-demand dns passthrough."
                exit 1 ;;
            esac
            n=$((n + 1))
            case "$name" in
              *[!A-Za-z0-9.*-]*|'*') bad="$bad $name" ;;
              \*.*) case "${name#\*.}" in *'*'*) bad="$bad $name" ;; esac ;;
              *'*'*) bad="$bad $name" ;;
            esac
          done < "$HOSTNAMES"
          if [ -n "$bad" ]; then
            echo "::error::not valid hostnames:$bad. Letters, digits, dot and hyphen, with an optional leading '*.' -- one per line."
            exit 1
          fi
          if [ "$n" -eq 0 ]; then
            echo "::error::hostnames file '$HOSTNAMES' has no hostnames in it. Leave the input empty for an app nothing outside reaches."
            exit 1
          fi
          cp "$HOSTNAMES" "$stage/hostnames"
          included="$included"$'\n'"hostnames <- $HOSTNAMES ($n name(s))"
        fi

        # Written outside the stage so it is not itself packaged into /config.
        #
        # The CMD is never executed. It exists because `docker create` rejects
        # an image with no command at all, and the host creates a container to
        # copy the files out of. The host passes --entrypoint for the same
        # reason, so this is belt-and-braces rather than load-bearing.
        df="$RUNNER_TEMP/Dockerfile.config"
        printf 'FROM scratch\nCOPY . /config\nCMD ["/config/compose.yml"]\n' > "$df"

        docker build -f "$df" -t "$IMAGE:$TAG" "$stage"
        # No :latest. This image is only ever addressed by exact tag; a floating
        # tag would be a way to change the stack without a deploy.
        docker push "$IMAGE:$TAG"

        echo "image-ref=$IMAGE:$TAG" >> "$GITHUB_OUTPUT"
        echo "Published $IMAGE:$TAG containing:"
        printf '%s\n' "$included" | sed 's/^/  /'
