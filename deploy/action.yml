name: Deploy
description: >
  The whole deploy, in one step: connect, publish this commit's config, set
  secrets, make the tag live, and check the result is serving.

  Everything except `version` and `app` is optional. Supply what your app needs
  and the rest is skipped — no config, no secrets, no health check.

  Secrets are declared once, in the environment, by name:

      env:
        KOMIZO_APP_NAME:    <the vars.KOMIZO_APP_NAME expression>
        KOMIZO_SERVER_URL:  <the vars.KOMIZO_SERVER_URL expression>
        KOMIZO_DEPLOY_KEY:  <the secrets.KOMIZO_DEPLOY_KEY expression>
        KOMIZO_KNOWN_HOSTS: <the vars.KOMIZO_KNOWN_HOSTS expression>

        KOMIZO_SECRET_DATABASE_URL: <the secrets.DATABASE_URL expression>

  Everything named KOMIZO_SECRET_<NAME> is pushed to the host as <NAME>. A
  composite action cannot read `secrets` itself — GitHub exposes that context
  to workflows only — so a value has to arrive as an environment variable
  either way; the prefix is what lets that env block be the only place a secret
  is named. Renaming comes free, since the left side is the name the host gets.

  What the host receives is exactly what is listed there and nothing else. That
  is the property worth keeping: the rest of the job's environment, including
  every secret this step does not need, stays out of it.

  This wraps connect, publish-config, set-secrets, activate and health-check.
  Those remain the primitives; reach for them when you need your own steps
  interleaved, and use this for everything else.

  It exists because the order is not obvious and two of the ways to get it
  wrong fail SILENTLY:

    * secrets set after the deploy — containers read their environment at
      start, and the deploy is what restarts them, so a secret written
      afterwards sits unused until the next deploy.
    * config published after the deploy — the host pulls the PREVIOUS commit's
      compose.yml and reports success.

inputs:
  # --- what to deploy -------------------------------------------------------
  version:
    description: Tag to deploy, normally the commit SHA.
    required: true

  # --- connection -----------------------------------------------------------
  # Omit `host` if the connect action already ran in this job, e.g. because you
  # needed `ssh deploy-target ...` for a backup before deploying.
  host:
    description: >
      Server hostname. Supplying it makes this action connect for you. Leave it
      empty if the connect action has already run in this job.

      Falls back to the KOMIZO_SERVER_URL environment variable, which is the name
      komizo tells you to store the server's address under -- so moving an app
      to another box is a repository variable rather than a commit.
    required: false
    default: ""
  user:
    description: >
      Deploy account. Defaults to komizo-<app>, which is what `komizo` creates, so
      you only need this if you overrode it. Only used when host is set.
    required: false
    default: ""
  key:
    description: >
      Private half of the deploy key. Required when host is set, unless the
      KOMIZO_DEPLOY_KEY environment variable carries it -- which is the name
      komizo tells you to store it under, and the one this falls back to.

      A composite action cannot read `secrets` itself; GitHub exposes that
      context to workflows only. So the fallback is an env var the caller sets
      once on the job rather than an input repeated on every step.
    required: false
    default: ""
  known-hosts:
    description: >
      The server's host keys as known_hosts LINES -- what komizo copies when
      you press `h` on an app's row. Required when host is set, unless
      allow-unpinned-host is true.

      Falls back to KOMIZO_KNOWN_HOSTS, for the same reason as `key` above.
    required: false
    default: ""
  port:
    description: SSH port.
    required: false
    default: "22"
  allow-unpinned-host:
    description: >
      Discover the host key at deploy time instead of pinning it. This is
      trust-on-first-use on EVERY run. Opt in only for throwaway hosts.
    required: false
    default: "false"

  # --- which app on the host -------------------------------------------------
  app:
    description: >
      App name, matching the one you gave it in `komizo`. Every app on a server
      has its own name, whether or not it shares the box: it selects the deploy
      account (komizo-<app>) and the privileged commands (deploy-<app> and
      set-secret-<app>).

      Falls back to the KOMIZO_APP_NAME environment variable, so a workflow can
      name it in settings alongside the other three rather than in this file.

      Note what that does NOT decouple: the name also appears in the app's own
      compose.yml (network aliases), its caddy fragment (/srv/<app>/...) and its
      image references, all of which are committed. Changing it in settings
      alone deploys into a directory the shipped config does not describe, and
      nothing reports that -- so if you move it, move all of them together.
    required: false
    default: ""

  # --- config ---------------------------------------------------------------
  config:
    description: >
      Path to this app's komizo.yml — the compose file and the hostnames it
      answers on, in one manifest. The modern form of the config-compose /
      config-hostnames pair below: pass this OR those, not both. Still needs
      config-image (the registry path the host is pinned to). Empty skips the
      config publish, leaving whatever compose.yml the host already has.
    required: false
    default: ""
  config-compose:
    description: >
      Path to this app's compose file, published for this commit. Empty skips
      the config publish entirely, leaving whatever compose.yml the host
      already has. Named explicitly, so the image holds exactly what you list
      and nothing neighbouring it. Prefer `config:` (a komizo.yml) for new apps.
    required: false
    default: ""
  config-hostnames:
    description: >
      Path to a file listing the hostnames this app answers on, one per line.
      Published with the config image; the host generates the reverse-proxy
      config from it and points every name at this app's gateway container.

      That is the whole of what an app tells the server about routing. What a
      request meets after the hostname match is inside your gateway, in a config
      you built into an image -- not a fragment concatenated into a file shared
      with every other app on the box.

      Leave empty for an app nothing outside reaches.
    required: false
    default: ""
  config-image:
    description: >
      Image reference WITHOUT a tag for the config image, e.g.
      ghcr.io/you/myapp-config. Must match the host's CONFIG_IMAGE.
      Required when config-compose is set.
    required: false
    default: ""

  # --- secrets --------------------------------------------------------------
  secrets:
    description: >
      Rarely needed. Newline-separated names for values passed as plain
      environment variables under their own names, rather than with the
      KOMIZO_SECRET_ prefix — use it for a value computed during the job.

      Normally leave this empty: name each secret KOMIZO_SECRET_<NAME> under
      `env:` and it is pushed as <NAME>, with no list to keep in agreement.
      See the top of this file.
    required: false
    default: ""

  # --- registry -------------------------------------------------------------
  registry:
    description: Registry the host authenticates against before pulling. Empty to skip.
    required: false
    default: ghcr.io
  registry-user:
    description: Registry username.
    required: false
    default: ""
  registry-token:
    description: >
      Registry password. Prefer the run-scoped GITHUB_TOKEN so nothing
      long-lived is left on the server.
    required: false
    default: ""

  # --- health check ---------------------------------------------------------
  # Setting health-urls is what enables the check; the rest are overrides. There
  # is no boolean toggle because a check with no URLs has nothing to poll.
  health-urls:
    description: >
      URLs to poll after deploying, one per line -- the deploy fails unless every
      one answers. The first token on a line is the URL; anything after it is a
      substring the body must contain (see the health-check action). Empty skips
      the check entirely. This is where a project states what "deployed and
      working" means for it: an API endpoint, a served bundle, a database's
      status -- as many as are worth proving, and no mapping to containers is
      enforced.
    required: false
    default: ""
  health-attempts:
    description: How many times to try before giving up.
    required: false
    default: "30"
  health-delay:
    description: Seconds between attempts.
    required: false
    default: "5"
  health-timeout:
    description: Seconds before a single request is considered failed.
    required: false
    default: "10"

outputs:
  version:
    description: The version that was deployed. Echoes the input, for chaining.
    value: ${{ steps.version.outputs.version }}
  previous-version:
    description: >
      The version that was live before this ran, as reported by the host. Empty
      on a first deploy. This is what makes an automatic rollback possible from
      a later step — see the README.
    value: ${{ steps.version.outputs.previous-version }}
  config-image-ref:
    description: >
      Full reference of the config image published, INCLUDING the tag — unlike
      the `config-image` input, which must not carry one. Empty if no config
      was published.
    value: ${{ steps.config.outputs.image-ref }}
  health-rounds-used:
    description: >
      Rounds the health check needed until every URL was healthy, if it ran.
      Named apart from the `health-attempts` input, which is the ceiling rather
      than the result.
    value: ${{ steps.health.outputs.rounds-used }}

runs:
  using: composite
  steps:
    # Which box, resolved once and read from here on.
    #
    # A step output rather than a bare fallback in each place that needs it,
    # because one of those places is an `if:` -- the connect step below runs
    # only when there is a host, and an expression cannot see a value that a
    # later shell would have defaulted. Without this, setting only KOMIZO_SERVER_URL
    # skipped the connection and failed two steps later complaining about an
    # ~/.ssh/config entry nobody asked for.
    #
    # The KEY is deliberately not resolved here: a step output is stored with
    # the job, and a private key belongs in an environment variable that goes
    # no further than the step reading it. connect does that fallback itself.
    - id: cfg
      shell: bash
      env:
        HOST: ${{ inputs.host }}
        APP: ${{ inputs.app }}
        SECRET_NAMES: ${{ inputs.secrets }}
      run: bash "$GITHUB_ACTION_PATH/resolve.sh"

    # Everything this action alone can check, checked before anything is
    # published or restarted -- so a misconfiguration costs a failed step rather
    # than a half-applied deploy.
    #
    # Both this and the step above live in files rather than inline, so a test
    # can drive them over the whole input matrix. They are the only logic in
    # this repository that nothing else exercises: every other action is a thin
    # wrapper around ssh or docker, and these two decide whether those run at
    # all. See tests/deploy-inputs.test.sh.
    - name: Validate inputs
      shell: bash
      env:
        HOST: ${{ steps.cfg.outputs.host }}
        APP: ${{ steps.cfg.outputs.app }}
        CONFIG: ${{ inputs.config }}
        CONFIG_COMPOSE: ${{ inputs.config-compose }}
        CONFIG_HOSTNAMES: ${{ inputs.config-hostnames }}
        CONFIG_IMAGE: ${{ inputs.config-image }}
      run: bash "$GITHUB_ACTION_PATH/validate.sh"

    # 1. Connect, unless an earlier step already did. This verifies the
    #    connection, so a bad key fails before anything has been published.
    - if: steps.cfg.outputs.host != ''
      uses: nicodes/komizo-actions/connect@38a9e017e1bfeea5c05f86c361e484dcb7d0bfae
      with:
        host: ${{ steps.cfg.outputs.host }}
        user: ${{ inputs.user != '' && inputs.user || format('komizo-{0}', steps.cfg.outputs.app) }}
        key: ${{ inputs.key }}
        known-hosts: ${{ inputs.known-hosts }}
        port: ${{ inputs.port }}
        allow-unpinned-host: ${{ inputs.allow-unpinned-host }}

    # 2. Publish this commit's compose.yml, so the host has it before it is
    #    asked to deploy this tag.
    - id: config
      if: inputs.config != '' || inputs.config-compose != ''
      uses: nicodes/komizo-actions/publish-config@38a9e017e1bfeea5c05f86c361e484dcb7d0bfae
      with:
        config: ${{ inputs.config }}
        compose: ${{ inputs.config-compose }}
        hostnames: ${{ inputs.config-hostnames }}
        image: ${{ inputs.config-image }}
        tag: ${{ inputs.version }}

    # 3. Secrets BEFORE the deploy, so the containers it recreates start with
    #    the current values.
    - if: steps.cfg.outputs.has-secrets == 'true'
      uses: nicodes/komizo-actions/set-secrets@38a9e017e1bfeea5c05f86c361e484dcb7d0bfae
      with:
        names: ${{ inputs.secrets }}
        command: doas /usr/local/bin/set-secret-${{ steps.cfg.outputs.app }}

    # 4. Make the tag live.
    - id: version
      uses: nicodes/komizo-actions/activate@38a9e017e1bfeea5c05f86c361e484dcb7d0bfae
      with:
        version: ${{ inputs.version }}
        registry: ${{ inputs.registry }}
        registry-user: ${{ inputs.registry-user }}
        registry-token: ${{ inputs.registry-token }}
        command: doas /usr/local/bin/deploy-${{ steps.cfg.outputs.app }}

    # 5. Prove it is serving. Skipped entirely when no URL is given.
    - id: health
      if: inputs.health-urls != ''
      uses: nicodes/komizo-actions/health-check@38a9e017e1bfeea5c05f86c361e484dcb7d0bfae
      with:
        urls: ${{ inputs.health-urls }}
        attempts: ${{ inputs.health-attempts }}
        delay: ${{ inputs.health-delay }}
        timeout: ${{ inputs.health-timeout }}
