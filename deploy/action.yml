name: Deploy
description: >
  The whole deploy, in one step: connect, publish this commit's config, set
  secrets, make the tag live, and check the result is serving.

  Everything except `version` and `app` is optional. Supply what your app needs
  and the rest is skipped — no config, no secrets, no health check.

  Secrets are declared once, in the environment, by name:

      env:
        KOMIZO_APP_NAME:    <the vars.KOMIZO_APP_NAME expression>
        KOMIZO_SERVER_URL:  <the vars.KOMIZO_SERVER_URL expression>
        KOMIZO_DEPLOY_KEY:  <the secrets.KOMIZO_DEPLOY_KEY expression>
        KOMIZO_KNOWN_HOSTS: <the vars.KOMIZO_KNOWN_HOSTS expression>

        KOMIZO_SECRET_DATABASE_URL: <the secrets.DATABASE_URL expression>

  Everything named KOMIZO_SECRET_<NAME> is pushed to the host as <NAME>. A
  composite action cannot read `secrets` itself — GitHub exposes that context
  to workflows only — so a value has to arrive as an environment variable
  either way; the prefix is what lets that env block be the only place a secret
  is named. Renaming comes free, since the left side is the name the host gets.

  What the host receives is exactly what is listed there and nothing else. That
  is the property worth keeping: the rest of the job's environment, including
  every secret this step does not need, stays out of it.

  This wraps connect, publish-config, set-secrets, set-version and healthcheck.
  Those remain the primitives; reach for them when you need your own steps
  interleaved, and use this for everything else.

  It exists because the order is not obvious and two of the ways to get it
  wrong fail SILENTLY:

    * secrets set after the deploy — containers read their environment at
      start, and the deploy is what restarts them, so a secret written
      afterwards sits unused until the next deploy.
    * config published after the deploy — the host pulls the PREVIOUS commit's
      compose.yml and reports success.

inputs:
  # --- what to deploy -------------------------------------------------------
  version:
    description: Tag to deploy, normally the commit SHA.
    required: true

  # --- connection -----------------------------------------------------------
  # Omit `host` if the connect action already ran in this job, e.g. because you
  # needed `ssh deploy-target ...` for a backup before deploying.
  host:
    description: >
      Server hostname. Supplying it makes this action connect for you. Leave it
      empty if the connect action has already run in this job.

      Falls back to the KOMIZO_SERVER_URL environment variable, which is the name
      komizo tells you to store the server's address under -- so moving an app
      to another box is a repository variable rather than a commit.
    required: false
    default: ""
  user:
    description: >
      Deploy account. Defaults to komizo-<app>, which is what `komizo` creates, so
      you only need this if you overrode it. Only used when host is set.
    required: false
    default: ""
  key:
    description: >
      Private half of the deploy key. Required when host is set, unless the
      KOMIZO_DEPLOY_KEY environment variable carries it -- which is the name
      komizo tells you to store it under, and the one this falls back to.

      A composite action cannot read `secrets` itself; GitHub exposes that
      context to workflows only. So the fallback is an env var the caller sets
      once on the job rather than an input repeated on every step.
    required: false
    default: ""
  known-hosts:
    description: >
      The server's host keys as known_hosts LINES -- what komizo copies when
      you press `h` on an app's row. Required when host is set, unless
      allow-unpinned-host is true.

      Falls back to KOMIZO_KNOWN_HOSTS, for the same reason as `key` above.
    required: false
    default: ""
  port:
    description: SSH port.
    required: false
    default: "22"
  allow-unpinned-host:
    description: >
      Discover the host key at deploy time instead of pinning it. This is
      trust-on-first-use on EVERY run. Opt in only for throwaway hosts.
    required: false
    default: "false"

  # --- which app on the host -------------------------------------------------
  app:
    description: >
      App name, matching the one you gave it in `komizo`. Every app on a server
      has its own name, whether or not it shares the box: it selects the deploy
      account (komizo-<app>) and the privileged commands (deploy-<app> and
      set-secret-<app>).

      Falls back to the KOMIZO_APP_NAME environment variable, so a workflow can
      name it in settings alongside the other three rather than in this file.

      Note what that does NOT decouple: the name also appears in the app's own
      compose.yml (network aliases), its caddy fragment (/srv/<app>/...) and its
      image references, all of which are committed. Changing it in settings
      alone deploys into a directory the shipped config does not describe, and
      nothing reports that -- so if you move it, move all of them together.
    required: false
    default: ""

  # --- config ---------------------------------------------------------------
  config-compose:
    description: >
      Path to this app's compose file, published for this commit. Empty skips
      the config publish entirely, leaving whatever compose.yml the host
      already has. Named explicitly, so the image holds exactly what you list
      and nothing neighbouring it.
    required: false
    default: ""
  config-hostnames:
    description: >
      Path to a file listing the hostnames this app answers on, one per line.
      Published with the config image; the host generates the reverse-proxy
      config from it and points every name at this app's gateway container.

      That is the whole of what an app tells the server about routing. What a
      request meets after the hostname match is inside your gateway, in a config
      you built into an image -- not a fragment concatenated into a file shared
      with every other app on the box.

      Leave empty for an app nothing outside reaches.
    required: false
    default: ""
  config-image:
    description: >
      Image reference WITHOUT a tag for the config image, e.g.
      ghcr.io/you/myapp-config. Must match the host's CONFIG_IMAGE.
      Required when config-compose is set.
    required: false
    default: ""

  # --- secrets --------------------------------------------------------------
  secrets:
    description: >
      Rarely needed. Newline-separated names for values passed as plain
      environment variables under their own names, rather than with the
      KOMIZO_SECRET_ prefix — use it for a value computed during the job.

      Normally leave this empty: name each secret KOMIZO_SECRET_<NAME> under
      `env:` and it is pushed as <NAME>, with no list to keep in agreement.
      See the top of this file.
    required: false
    default: ""

  # --- registry -------------------------------------------------------------
  registry:
    description: Registry the host authenticates against before pulling. Empty to skip.
    required: false
    default: ghcr.io
  registry-user:
    description: Registry username.
    required: false
    default: ""
  registry-token:
    description: >
      Registry password. Prefer the run-scoped GITHUB_TOKEN so nothing
      long-lived is left on the server.
    required: false
    default: ""

  # --- health check ---------------------------------------------------------
  # Setting health-url is what enables the check; the rest are overrides. There
  # is no boolean toggle because a check without a URL has nothing to poll.
  health-url:
    description: URL to poll after deploying. Empty skips the check entirely.
    required: false
    default: ""
  health-expect:
    description: >
      Substring the response body must contain. Empty means any 2xx counts,
      which is usually what you want.
    required: false
    default: ""
  health-attempts:
    description: How many times to try before giving up.
    required: false
    default: "30"
  health-delay:
    description: Seconds between attempts.
    required: false
    default: "5"
  health-timeout:
    description: Seconds before a single request is considered failed.
    required: false
    default: "10"

outputs:
  version:
    description: The version that was deployed. Echoes the input, for chaining.
    value: ${{ steps.version.outputs.version }}
  previous-version:
    description: >
      The version that was live before this ran, as reported by the host. Empty
      on a first deploy. This is what makes an automatic rollback possible from
      a later step — see the README.
    value: ${{ steps.version.outputs.previous-version }}
  config-image-ref:
    description: >
      Full reference of the config image published, INCLUDING the tag — unlike
      the `config-image` input, which must not carry one. Empty if no config
      was published.
    value: ${{ steps.config.outputs.image-ref }}
  health-attempts-used:
    description: >
      Attempts the health check actually needed, if it ran. Named apart from
      the `health-attempts` input, which is the ceiling rather than the result.
    value: ${{ steps.health.outputs.attempts-used }}

runs:
  using: composite
  steps:
    # Which box, resolved once and read from here on.
    #
    # A step output rather than a bare fallback in each place that needs it,
    # because one of those places is an `if:` -- the connect step below runs
    # only when there is a host, and an expression cannot see a value that a
    # later shell would have defaulted. Without this, setting only KOMIZO_SERVER_URL
    # skipped the connection and failed two steps later complaining about an
    # ~/.ssh/config entry nobody asked for.
    #
    # The KEY is deliberately not resolved here: a step output is stored with
    # the job, and a private key belongs in an environment variable that goes
    # no further than the step reading it. connect does that fallback itself.
    - id: cfg
      shell: bash
      env:
        HOST: ${{ inputs.host }}
        APP: ${{ inputs.app }}
        SECRET_NAMES: ${{ inputs.secrets }}
      run: |
        set -euo pipefail
        : "${HOST:=${KOMIZO_SERVER_URL:-}}"
        # A hostname, not a URL. See connect: a scheme is stripped rather than
        # rejected, because it is the obvious thing to paste into a variable
        # with that name and ssh cannot use it.
        HOST="${HOST#*://}"
        HOST="${HOST%%/*}"
        echo "host=$HOST" >> "$GITHUB_OUTPUT"

        # Same treatment for the app name, and for the same reason: it decides
        # the ssh user and the two privileged command names, and those are read
        # by composed steps that cannot re-derive a shell default.
        : "${APP:=${KOMIZO_APP_NAME:-}}"
        echo "app=$APP" >> "$GITHUB_OUTPUT"

        # Whether there are secrets to push, for the same reason as the host:
        # the set-secrets step below is guarded by an `if:`, and an expression
        # cannot see environment variables that only exist at run time. With
        # the KOMIZO_SECRET_ prefix the env block is the list, so there is no
        # input for that `if:` to test.
        if [ -n "${SECRET_NAMES//[[:space:]]/}" ] || compgen -v | grep -q '^KOMIZO_SECRET_'; then
          echo "has-secrets=true" >> "$GITHUB_OUTPUT"
        else
          echo "has-secrets=false" >> "$GITHUB_OUTPUT"
        fi

    # Everything is checked before anything is published or restarted, so a
    # misconfiguration costs a failed step rather than a half-applied deploy.
    - name: Validate inputs
      shell: bash
      env:
        HOST: ${{ steps.cfg.outputs.host }}
        KEY: ${{ inputs.key }}
        KNOWN_HOSTS: ${{ inputs.known-hosts }}
        ALLOW_UNPINNED: ${{ inputs.allow-unpinned-host }}
        APP: ${{ steps.cfg.outputs.app }}
        CONFIG_COMPOSE: ${{ inputs.config-compose }}
        CONFIG_HOSTNAMES: ${{ inputs.config-hostnames }}
        CONFIG_IMAGE: ${{ inputs.config-image }}
        SECRET_NAMES: ${{ inputs.secrets }}
      run: |
        set -euo pipefail

        if [ -n "${HOST:-}" ]; then
          # komizo's own names, used when the caller passed nothing. connect
          # does the same, so a workflow can set these once under env: and
          # never name them again.
          : "${KEY:=${KOMIZO_DEPLOY_KEY:-}}"
          : "${KNOWN_HOSTS:=${KOMIZO_KNOWN_HOSTS:-}}"

          if [ -z "${KEY:-}" ]; then
            # D holds a bare dollar so the two-brace sequence is never present
            # in this file. Actions parses ${'{{'} out of a composite action's
            # template before bash runs, and a composite action has no secrets
            # context -- so writing the hint literally makes the action fail to
            # LOAD, for every caller, regardless of shell escaping.
            D='$'
            echo "::error::host is set but no deploy key was given. Pass 'key: ${D}{{ secrets.KOMIZO_DEPLOY_KEY }}', or set KOMIZO_DEPLOY_KEY under env: on the job. komizo prints the value when you add an app, and copies it to your clipboard when you rotate one."
            exit 1
          fi
          if [ -z "${KNOWN_HOSTS:-}" ] && [ "${ALLOW_UNPINNED:-false}" != "true" ]; then
            echo "::error::host is set but no host keys were given. Pass 'known-hosts:', or set KOMIZO_KNOWN_HOSTS under env: on the job -- komizo copies the value when you press 'h' on the app's row. Store it as a repository VARIABLE rather than a secret: it needs integrity, not secrecy, and leaving it unmasked keeps a host-key mismatch legible in the log. To skip pinning anyway, set allow-unpinned-host: true."
            exit 1
          fi
        else
          # No host given, so an earlier step must have run connect. Check the
          # file connect writes rather than asking ssh: OpenSSH resolves
          # ~/.ssh/config from the passwd database, not $HOME, which makes
          # `ssh -G` answer for the wrong home in some environments.
          if ! grep -qE '^[[:space:]]*Host[[:space:]]+deploy-target[[:space:]]*$' "$HOME/.ssh/config" 2>/dev/null; then
            echo "::error::No 'host' input and no deploy-target entry in ~/.ssh/config. Either pass host/key/known-hosts to this action, or run the connect action in an earlier step."
            exit 1
          fi
          echo "Using the deploy-target configured by an earlier step."
        fi

        # Interpolated into a command path below, so constrain it. Required:
        # without it the deploy would target `deploy-` and `komizo-`, which is
        # not a smaller mistake than a wrong name, only a stranger one.
        if [ -z "${APP:-}" ]; then
          D='$'
          echo "::error::No app name. Set the repository variable KOMIZO_APP_NAME and pass 'KOMIZO_APP_NAME: ${D}{{ vars.KOMIZO_APP_NAME }}' under env:, or pass 'app:' directly. It is the name you gave the app in komizo."
          exit 1
        fi
        case "$APP" in
          *[!A-Za-z0-9_-]*)
            echo "::error::app must be letters, digits, underscore or hyphen; got '$APP'."
            exit 1 ;;
        esac

        if [ -n "$CONFIG_COMPOSE" ] && [ -z "$CONFIG_IMAGE" ]; then
          echo "::error::config-compose is set but config-image is empty. Pass the registry path the host was bootstrapped with (its CONFIG_IMAGE)."
          exit 1
        fi
        if [ -z "$CONFIG_COMPOSE" ] && [ -n "$CONFIG_IMAGE" ]; then
          echo "::error::config-image is set but config-compose is empty. Point config-compose at this app's compose file."
          exit 1
        fi
        # The hostnames ride along with the compose file in one image, so naming
        # them without it publishes nothing and silently does nothing -- which
        # would look exactly like a working deploy.
        if [ -z "$CONFIG_COMPOSE" ] && [ -n "$CONFIG_HOSTNAMES" ]; then
          echo "::error::config-hostnames is set but config-compose is empty. They are published together in one image, so nothing would be shipped."
          exit 1
        fi

        # Confirm every secret has a non-empty value, so one that failed to
        # propagate surfaces here -- before anything is published or restarted
        # -- rather than as an app that starts misconfigured.
        #
        # Empty matters as much as missing: GitHub substitutes an empty string
        # for a secret that does not exist, so a name declared in the workflow
        # and never created in the repository is indistinguishable from one
        # that was supplied, to a check that only asks whether the name is set.
        names=()
        while IFS= read -r name; do
          name="${name//[[:space:]]/}"
          [ -n "$name" ] && names+=("$name")
        done <<< "$SECRET_NAMES"
        while IFS= read -r var; do
          [ -n "$var" ] && names+=("${var#KOMIZO_SECRET_}")
        done < <(compgen -v | grep '^KOMIZO_SECRET_' | sort || true)

        missing=() blank=()
        for name in "${names[@]:-}"; do
          [ -z "$name" ] && continue
          prefixed="KOMIZO_SECRET_$name"
          if [ -n "${!prefixed+set}" ]; then
            [ -n "${!prefixed}" ] || blank+=("$name")
          elif [ -n "${!name+set}" ]; then
            [ -n "${!name}" ] || blank+=("$name")
          else
            missing+=("$name")
          fi
        done
        if [ ${#missing[@]} -gt 0 ]; then
          D='$'
          echo "::error::No environment variable for: ${missing[*]}. Pass each under env: on this step, e.g. 'KOMIZO_SECRET_${missing[0]}: ${D}{{ secrets.${missing[0]} }}'. Environment-scoped secrets are invisible to jobs without that environment."
          exit 1
        fi
        if [ ${#blank[@]} -gt 0 ]; then
          echo "::error::Empty value for: ${blank[*]}. GitHub substitutes an empty string for a secret that does not exist, so check each is actually set in this repository -- and in the environment this job declares, if that is where its secrets live."
          exit 1
        fi

    # 1. Connect, unless an earlier step already did. This verifies the
    #    connection, so a bad key fails before anything has been published.
    - if: steps.cfg.outputs.host != ''
      uses: nicodes/komizo-actions/connect@b4d3fadf319a55a5f844f81eb6f658fc0eac708a
      with:
        host: ${{ steps.cfg.outputs.host }}
        user: ${{ inputs.user != '' && inputs.user || format('komizo-{0}', steps.cfg.outputs.app) }}
        key: ${{ inputs.key }}
        known-hosts: ${{ inputs.known-hosts }}
        port: ${{ inputs.port }}
        allow-unpinned-host: ${{ inputs.allow-unpinned-host }}

    # 2. Publish this commit's compose.yml, so the host has it before it is
    #    asked to deploy this tag.
    - id: config
      if: inputs.config-compose != ''
      uses: nicodes/komizo-actions/publish-config@b4d3fadf319a55a5f844f81eb6f658fc0eac708a
      with:
        compose: ${{ inputs.config-compose }}
        hostnames: ${{ inputs.config-hostnames }}
        image: ${{ inputs.config-image }}
        tag: ${{ inputs.version }}

    # 3. Secrets BEFORE the deploy, so the containers it recreates start with
    #    the current values.
    - if: steps.cfg.outputs.has-secrets == 'true'
      uses: nicodes/komizo-actions/set-secrets@b4d3fadf319a55a5f844f81eb6f658fc0eac708a
      with:
        names: ${{ inputs.secrets }}
        command: doas /usr/local/bin/set-secret-${{ steps.cfg.outputs.app }}

    # 4. Make the tag live.
    - id: version
      uses: nicodes/komizo-actions/set-version@b4d3fadf319a55a5f844f81eb6f658fc0eac708a
      with:
        version: ${{ inputs.version }}
        registry: ${{ inputs.registry }}
        registry-user: ${{ inputs.registry-user }}
        registry-token: ${{ inputs.registry-token }}
        command: doas /usr/local/bin/deploy-${{ steps.cfg.outputs.app }}

    # 5. Prove it is serving. Skipped entirely when no URL is given.
    - id: health
      if: inputs.health-url != ''
      uses: nicodes/komizo-actions/healthcheck@b4d3fadf319a55a5f844f81eb6f658fc0eac708a
      with:
        url: ${{ inputs.health-url }}
        expect: ${{ inputs.health-expect }}
        attempts: ${{ inputs.health-attempts }}
        delay: ${{ inputs.health-delay }}
        timeout: ${{ inputs.health-timeout }}
