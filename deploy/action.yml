name: Deploy immutable release
description: Submit one app-scoped release and wait for its durable native readiness receipt
inputs:
  application:
    description: Application identity admitted by host policy
    required: true
  instance:
    description: Production or independently isolated preview instance
    default: production
  release:
    description: Exact accepted release descriptor
    default: .artifacts/komizo-release/release.json
  release-proof:
    description: Independent trusted publisher proof for these exact release bytes
    default: .artifacts/komizo-release/proof.json
  timeout-seconds:
    description: Completion deadline up to twenty-five minutes
    default: '1500'
  expected-secret-generations:
    description: JSON object mapping owner-installed policy aliases to exact generation identities
    default: '{}'
  ttl-seconds:
    description: Source-declared finite preview lifetime; forbidden for production
    default: ''
  registry-user:
    description: Registry user for private artifact admission
    default: ''
  registry-token:
    description: Registry token sent only in the audience-bound request over SSH stdin
    default: ''
outputs:
  proposed-operation-id:
    description: Client-derived recovery identity; admission requires a host receipt or inspection
    value: ${{ steps.submit.outputs.proposed-operation-id }}
  operation-id:
    description: Durable host operation identity
    value: ${{ steps.submit.outputs.operation-id }}
  release-digest:
    description: Canonical release descriptor identity
    value: ${{ steps.submit.outputs.release-digest }}
  phase:
    description: Verified terminal operation phase
    value: ${{ steps.submit.outputs.phase }}
runs:
  using: composite
  steps:
    - name: Submit exact release
      id: submit
      shell: bash
      env:
        APPLICATION: ${{ inputs.application }}
        INSTANCE: ${{ inputs.instance }}
        RELEASE: ${{ inputs.release }}
        RELEASE_PROOF: ${{ inputs.release-proof }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        EXPECTED_SECRET_GENERATIONS: ${{ inputs.expected-secret-generations }}
        TTL_SECONDS: ${{ inputs.ttl-seconds }}
        KOMIZO_REGISTRY_USER: ${{ inputs.registry-user }}
        KOMIZO_REGISTRY_TOKEN: ${{ inputs.registry-token }}
      run: |
        set -euo pipefail
        arguments=()
        if [[ -n "$TTL_SECONDS" ]]; then arguments+=(--ttl-seconds "$TTL_SECONDS"); fi
        python3 -I -B "$GITHUB_ACTION_PATH/../scripts/submission.py" --application "$APPLICATION" --instance "$INSTANCE" --action deploy --release "$RELEASE" --release-proof "$RELEASE_PROOF" --timeout "$TIMEOUT_SECONDS" --expected-secret-generations "$EXPECTED_SECRET_GENERATIONS" "${arguments[@]}"
