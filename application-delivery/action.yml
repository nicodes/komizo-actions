name: Admit application delivery plan
description: Admit caller-owned delivery data through its accepted Cookbook provider before any host effects
inputs:
  cookbook-ref:
    description: Accepted standalone Cookbook source commit
    required: true
  project:
    description: Application identity
    required: true
  declaration:
    description: Tracked delivery declaration
    required: true
  plan-only:
    description: Explicit data-only admission
    default: 'true'
  sdk-prepared:
    description: Exact Cookbook and derived Tools are already prepared
    default: 'true'
outputs:
  backup:
    description: Tracked encrypted-export policy
    value: ${{ steps.plan.outputs.backup }}
  health-urls:
    description: Source-owned public health assertions
    value: ${{ steps.plan.outputs.health-urls }}
  upload:
    description: Source-owned encrypted upload decision
    value: ${{ steps.plan.outputs.upload }}
  allowed-products:
    description: Exact runner storage scope
    value: ${{ steps.plan.outputs.allowed-products }}
  readiness:
    description: Source-owned product readiness assertions
    value: ${{ steps.plan.outputs.readiness }}
  readiness-operation:
    description: Native operational readiness is declared
    value: ${{ steps.plan.outputs.readiness-operation }}
  expected-secret-generations:
    description: Exact owner-installed alias generation expectations
    value: ${{ steps.plan.outputs.expected-secret-generations }}
  godot-production:
    description: The declared public Godot browser gate needs its accepted payload identity
    value: ${{ steps.plan.outputs.godot-production }}
runs:
  using: composite
  steps:
  - name: Require current main before host effects
    shell: bash
    run: python3 "$GITHUB_ACTION_PATH/../scripts/require-current-deployment.py"
  - name: Admit native delivery declaration
    id: plan
    shell: bash
    env:
      PROJECT: ${{ inputs.project }}
      DECLARATION: ${{ inputs.declaration }}
      COOKBOOK_REF: ${{ inputs.cookbook-ref }}
      PLAN_ONLY: ${{ inputs.plan-only }}
      SDK_PREPARED: ${{ inputs.sdk-prepared }}
    run: |
      set -euo pipefail
      [[ "$PLAN_ONLY" == true && "$SDK_PREPARED" == true ]]
      "${COOKBOOK_BOOTSTRAP_PYTHON:-python3}" -I -B "$GITHUB_ACTION_PATH/plan.py" --cookbook-root "${COOKBOOK_ROOT:?Prepare the exact Cookbook source}" --cookbook-ref "$COOKBOOK_REF" --tools-root "${TOOLS_ROOT:?Prepare its derived Tools source}"
