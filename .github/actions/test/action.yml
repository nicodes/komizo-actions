name: Test
description: "Is this commit good: actionlint over the workflows, shellcheck over every script, and the tests for the two things in this repository that are pure functions of their inputs.\nA composite action rather than a reusable workflow so it runs in the caller's job, under the caller's name \u2014 ci / Test, release / Test \u2014 rather than as a nested \"caller / callee\" check.\nONE definition, called by CI and by Release both. Two would drift in a single direction: the copy guarding the release gets trimmed to make releases faster, until it no longer matches the one people trust on a pull request. That is the same reasoning the CLI repo's .github/actions/{test,build} exist for.\nactionlint is IN here now. It used to be a job of its own in the lint workflow, on two grounds: it validates workflow files, which is a property of this repository rather than of a release, and it is a marketplace action with its own pinning story. The second stopped holding once everything here was pinned by SHA. The first still stands, and folding it in is a deliberate trade: a release is now gated on workflow-file syntax it does not strictly depend on, and in exchange every workflow in the organisation is one job.\n"
runs:
  using: composite
  steps:
  - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
  - name: Verify action library
    shell: bash
    run: make install check
