name: Lint

# Static analysis for the composite actions and the release script, plus the
# tests for the two things in this repository that are pure functions of their
# inputs. There is no build to run -- these are shell embedded in YAML -- so
# what can go wrong is workflow/action syntax, the bash inside `run:` blocks,
# and the input handling that decides whether any of it executes.
#
# The shellcheck and test steps live in .github/actions/check, because Release
# runs them too and one definition is what stops the release-side copy being
# trimmed until it no longer matches what people trust on a pull request.

on:
  push:
  pull_request:

# Read-only: this workflow only inspects the tree.
permissions:
  contents: read

# Third-party actions are pinned by SHA, with the tag in a trailing comment so
# the version is still readable. This repository tells its users to pin
# `uses:` by SHA -- scripts/release.sh exists to make that pin mean what it
# says -- and preaching it while running floating tags was the sort of
# inconsistency that undercuts the advice.

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Lints the workflow files under .github/workflows (this one included) for
      # schema and expression errors. Not in the shared check action: it is a
      # property of this repository rather than of a release, and it is a
      # marketplace action with its own pinning story.
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/check
