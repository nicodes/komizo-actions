name: Deliver
'on':
  workflow_call:
    inputs:
      cookbook-ref:
        type: string
        required: true
      komizo-ref:
        type: string
        required: true
      project:
        type: string
        required: true
      declaration:
        type: string
        required: true
      runner:
        type: string
        required: true
      timeout-minutes:
        type: number
        required: true
      environment:
        type: string
        required: true
      step-timeouts:
        type: string
        required: true
      deployment-url:
        type: string
        required: true
      notify:
        type: boolean
        default: true
      report:
        type: boolean
        default: true
      preview-clerk-key:
        type: string
        default: ''
    outputs:
      phase:
        description: Confirmed native operation phase
        value: ${{ jobs.deliver.outputs.phase }}
      release-digest:
        description: Exact admitted deployment descriptor identity
        value: ${{ jobs.deliver.outputs.release-digest }}
      public-release-id:
        description: Exact accepted Godot static payload identity
        value: ${{ jobs.deliver.outputs.public-release-id }}
    secrets:
      KOMIZO_DEPLOY_KEY:
        required: true
      BACKUP_S3_ACCESS_KEY:
        required: false
      BACKUP_S3_SECRET_KEY:
        required: false
      DISCORD_WEBHOOK_URL:
        required: false
permissions: {}
jobs:
  deliver:
    name: Deploy
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
      packages: write
      attestations: read
      id-token: write
      issues: write
    env:
      COOKBOOK_REF: ${{ inputs.cookbook-ref }}
      KOMIZO_REF: ${{ inputs.komizo-ref }}
      GH_TOKEN: ${{ github.token }}
      MISE_AUTO_INSTALL: 'false'
      MISE_EXEC_AUTO_INSTALL: 'false'
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
    steps:
    - name: Require exact protected main source
      shell: bash
      run: |
        set -euo pipefail
        [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
        [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
        [[ "$COOKBOOK_REF" =~ ^[a-f0-9]{40}$ && "$KOMIZO_REF" =~ ^[a-f0-9]{40}$ ]]
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: ${{ fromJSON(inputs.step-timeouts).checkout }}
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        persist-credentials: false
    - name: Check out deployment actions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: ${{ fromJSON(inputs.step-timeouts).setup }}
      with:
        repository: nicodes/komizo-actions
        ref: ${{ inputs.komizo-ref }}
        path: _delivery_actions
        fetch-depth: 1
        persist-credentials: false
    - name: Check out Cookbook
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: ${{ fromJSON(inputs.step-timeouts).setup }}
      with:
        repository: nicodes/cookbook
        ref: ${{ inputs.cookbook-ref }}
        path: .artifacts/recipe-sdks/_cookbook
        fetch-depth: 1
        persist-credentials: false
    - name: Stop when main has advanced
      id: current
      shell: bash
      run: python3 -I -B _delivery_actions/scripts/require-current-deployment.py
    - name: Prepare recipe sources and dependencies
      uses: ./.artifacts/recipe-sdks/_cookbook/prepare
      timeout-minutes: ${{ fromJSON(inputs.step-timeouts).prepare }}
      with:
        cookbook-ref: ${{ inputs.cookbook-ref }}
        source: ${{ github.sha }}
        checkout: 'false'
        advisories: skip
        preview-clerk-key: ${{ inputs.preview-clerk-key }}
    - name: Build
      uses: ./.artifacts/recipe-sdks/_cookbook/build
      timeout-minutes: ${{ fromJSON(inputs.step-timeouts).build }}
    - name: Test
      uses: ./.artifacts/recipe-sdks/_cookbook/test
      timeout-minutes: ${{ fromJSON(inputs.step-timeouts).test }}
    - name: Plan deployment
      uses: ./_delivery_actions/application-delivery
      id: plan
      timeout-minutes: ${{ fromJSON(inputs.step-timeouts).plan }}
      with:
        cookbook-ref: ${{ inputs.cookbook-ref }}
        project: ${{ inputs.project }}
        declaration: ${{ inputs.declaration }}
    - name: Start delivery budget
      shell: bash
      env:
        TOTAL_MINUTES: ${{ inputs.timeout-minutes }}
      run: python3 -I -B _delivery_actions/scripts/operation_budget.py --from-now --total-minutes "$TOTAL_MINUTES"
    - name: Prepare host connection
      uses: ./_delivery_actions/connect
      timeout-minutes: ${{ fromJSON(inputs.step-timeouts).connect }}
      env:
        KOMIZO_SERVER_URL: ${{ vars.KOMIZO_SERVER_URL }}
        KOMIZO_KNOWN_HOSTS: ${{ vars.KOMIZO_KNOWN_HOSTS }}
        KOMIZO_DEPLOY_KEY: ${{ secrets.KOMIZO_DEPLOY_KEY }}
    - name: Capture encrypted backup
      uses: ./_delivery_actions/backup-transfer
      id: backup
      if: steps.plan.outputs.backup != ''
      timeout-minutes: ${{ fromJSON(inputs.step-timeouts).capture }}
      with:
        mode: export
        project: ${{ inputs.project }}
        config: ${{ steps.plan.outputs.backup }}
    - name: Upload encrypted backup
      uses: ./_delivery_actions/backup-transfer
      if: steps.backup.outputs.has-export == 'true' && steps.plan.outputs.upload == 'true'
      timeout-minutes: ${{ fromJSON(inputs.step-timeouts).upload }}
      with:
        mode: upload
        project: ${{ inputs.project }}
      env:
        BACKUP_ALLOWED_SLUGS: ${{ steps.plan.outputs.allowed-products }}
        BACKUP_S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
        BACKUP_S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
        BACKUP_S3_HOSTNAME: ${{ vars.BACKUP_S3_HOSTNAME }}
        BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
    - name: Publish
      timeout-minutes: ${{ fromJSON(inputs.step-timeouts).publish }}
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        KOMIZO_REGISTRY_USER: ${{ github.repository_owner }}
        KOMIZO_REGISTRY_TOKEN: ${{ github.token }}
      run: python3 -I -B _delivery_actions/scripts/deliver.py publish --source "$GITHUB_SHA" --project "$PROJECT" --cookbook-root "$COOKBOOK_ROOT" --cookbook-ref "$COOKBOOK_REF" --tools-root "$TOOLS_ROOT"
    - name: Authorize
      timeout-minutes: ${{ fromJSON(inputs.step-timeouts).download }}
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
      run: python3 -I -B _delivery_actions/scripts/deliver.py authorize --source "$GITHUB_SHA" --project "$PROJECT" --cookbook-root "$COOKBOOK_ROOT" --cookbook-ref "$COOKBOOK_REF" --tools-root "$TOOLS_ROOT"
    - name: Bound deployment to its remaining native phase budget
      shell: bash
      env:
        TOTAL_MINUTES: ${{ inputs.timeout-minutes }}
        PHASE_MINUTES: ${{ fromJSON(inputs.step-timeouts).deploy }}
      run: python3 -I -B _delivery_actions/scripts/operation_budget.py --from-now --total-minutes "$TOTAL_MINUTES" --phase-seconds "$((PHASE_MINUTES * 60))"
    - name: Deploy
      uses: ./_delivery_actions/deploy
      id: deploy
      timeout-minutes: ${{ fromJSON(inputs.step-timeouts).deploy }}
      with:
        application: ${{ inputs.project }}
        registry-user: ${{ github.repository_owner }}
        registry-token: ${{ github.token }}
        expected-secret-generations: ${{ steps.plan.outputs.expected-secret-generations || '{}' }}
    - name: Read the accepted public payload identity for independent browser acceptance
      id: public
      if: steps.deploy.outputs.phase == 'ready' && steps.plan.outputs.godot-production == 'true'
      timeout-minutes: ${{ fromJSON(inputs.step-timeouts).readiness }}
      shell: bash
      run: python3 -I -B _delivery_actions/scripts/public_identity.py
    - name: Check health
      uses: ./_delivery_actions/health-check
      if: steps.deploy.outputs.phase == 'ready' && steps.plan.outputs.health-urls != ''
      timeout-minutes: ${{ fromJSON(inputs.step-timeouts).readiness }}
      with:
        urls: ${{ steps.plan.outputs.health-urls }}
    - name: Check readiness
      uses: ./_delivery_actions/application-readiness
      if: steps.deploy.outputs.phase == 'ready' && (steps.plan.outputs.readiness != '' || steps.plan.outputs.readiness-operation == 'true')
      timeout-minutes: ${{ fromJSON(inputs.step-timeouts).readiness }}
      with:
        declaration: ${{ inputs.declaration }}
    - name: Retain the bounded historical activation receipt
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      timeout-minutes: ${{ fromJSON(inputs.step-timeouts).artifact }}
      with:
        name: activation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/komizo-operation.json
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 30
    - name: Retain the publication evidence without release authority
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ always() && hashFiles('.artifacts/komizo-release/release.json') != '' }}
      timeout-minutes: ${{ fromJSON(inputs.step-timeouts).artifact }}
      with:
        name: host-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          .artifacts/komizo-release/
          !.artifacts/komizo-release/proof.json
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 7
    - name: Retain only the verified encrypted backup pair
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ always() && steps.backup.outputs.has-export == 'true' }}
      timeout-minutes: ${{ fromJSON(inputs.step-timeouts).artifact }}
      with:
        name: backup-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/backup/export/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 30
    - name: Retain the distinct absent or stopped backup status
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ always() && steps.backup.outputs.has-export == 'false' }}
      timeout-minutes: ${{ fromJSON(inputs.step-timeouts).artifact }}
      with:
        name: backup-status-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          .artifacts/backup/first-deployment.json
          .artifacts/backup/stopped.json
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 30
    - name: Finish
      uses: ./.artifacts/recipe-sdks/_cookbook/finish
      if: always()
      timeout-minutes: ${{ fromJSON(inputs.step-timeouts).finish || 5 }}
      with:
        status: ${{ job.status }}
    - name: Report failure
      if: failure() && inputs.report && steps.current.outputs.stale != 'true'
      timeout-minutes: ${{ fromJSON(inputs.step-timeouts).report }}
      shell: bash
      run: python3 -I -B "${TOOLS_ROOT:-.artifacts/recipe-sdks/_tools}/helpers/report-failure.py"
    - name: Notify
      uses: ./_delivery_actions/notify-discord
      if: always() && !cancelled() && inputs.notify && steps.current.outputs.stale != 'true'
      continue-on-error: true
      timeout-minutes: ${{ fromJSON(inputs.step-timeouts).notify || 2 }}
      with:
        webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
        deployment-url: ${{ inputs.deployment-url }}
        environment: ${{ inputs.environment }}
        status: ${{ job.status == 'success' && (steps.deploy.outputs.phase == 'ready' || steps.deploy.outputs.phase == 'prepared_stopped') && 'success' || 'failure' }}
        revision: ${{ github.sha }}
    outputs:
      phase: ${{ steps.deploy.outputs.phase }}
      release-digest: ${{ steps.deploy.outputs.release-digest }}
      public-release-id: ${{ steps.public.outputs.release-id }}
concurrency:
  group: deploy-production
  cancel-in-progress: false
