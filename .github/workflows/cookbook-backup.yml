name: Capture routine encrypted backup
'on':
  workflow_call:
    inputs:
      cookbook-ref:
        type: string
        required: true
      komizo-ref:
        type: string
        required: true
      declaration:
        type: string
        required: true
      step-timeouts:
        type: string
        required: true
      runner:
        type: string
        required: true
      timeout-minutes:
        type: number
        required: true
      environment:
        type: string
        required: false
        default: ''
      report-timeout:
        type: number
        required: true
    secrets:
      KOMIZO_DEPLOY_KEY:
        required: false
      BACKUP_S3_ACCESS_KEY:
        required: false
      BACKUP_S3_SECRET_KEY:
        required: false
permissions: {}
jobs:
  backup:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs['timeout-minutes'] }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
      attestations: read
    env:
      COOKBOOK_REF: ${{ inputs.cookbook-ref }}
      KOMIZO_REF: ${{ inputs.komizo-ref }}
      DECLARATION: ${{ inputs.declaration }}
      OPERATION: backup
      OPERATION_CHECK: ''
      OPERATION_RUNNER: ${{ inputs.runner }}
      OPERATION_TIMEOUT: ${{ inputs['timeout-minutes'] }}
      OPERATION_STEP_TIMEOUTS: ${{ inputs['step-timeouts'] }}
      OPERATION_ENVIRONMENT: ${{ inputs.environment }}
      OPERATION_REPORT_TIMEOUT: ${{ inputs['report-timeout'] }}
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      MISE_AUTO_INSTALL: 'false'
      MISE_EXEC_AUTO_INSTALL: 'false'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.artifacts/playwright
    steps:
    - name: Require one exact recipe source contract
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).plan }}
      shell: bash
      env:
        COOKBOOK_REF: ${{ inputs.cookbook-ref }}
      run: |
        set -euo pipefail
        [[ "$COOKBOOK_REF" =~ ^[a-f0-9]{40}$ ]]
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).checkout }}
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 0
    - name: Bootstrap Python for protected SDK sources
      if: ${{ runner.os == 'Windows' && inputs.cookbook-ref != '' }}
      id: sdk-private-python
      timeout-minutes: 5
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      env:
        MISE_AUTO_INSTALL: 'false'
        MISE_EXEC_AUTO_INSTALL: 'false'
        MISE_TASK_RUN_AUTO_INSTALL: 'false'
      with:
        python-version: 3.13.11
        check-latest: false
    - name: Prepare the private artifact parent with actual pinned Python
      if: ${{ runner.os == 'Windows' && inputs.cookbook-ref != '' }}
      timeout-minutes: 1
      shell: bash
      env:
        PRIVATE_PYTHON: ${{ steps.sdk-private-python.outputs.python-path }}
        MISE_AUTO_INSTALL: 'false'
        MISE_EXEC_AUTO_INSTALL: 'false'
        MISE_TASK_RUN_AUTO_INSTALL: 'false'
      run: |
        set -euo pipefail
        "$PRIVATE_PYTHON" -I -B -c 'exec('"'"'import os\nfrom pathlib import Path\nimport stat\nimport sys\nif os.name == "nt" and sys.version_info < (3, 13):\n    raise SystemExit("Windows private SDK directories require the selected Python 3.13 or newer")\nparent = Path.cwd() / ".artifacts"\nfor candidate in [parent, *parent.parents]:\n    try:\n        info = candidate.lstat()\n    except FileNotFoundError:\n        continue\n    if stat.S_ISLNK(info.st_mode) or getattr(info, "st_file_attributes", 0) & 0x400:\n        raise SystemExit("SDK artifact parent must not traverse links or reparse points")\nif parent.exists():\n    if not parent.is_dir():\n        raise SystemExit("SDK artifact parent must be a directory")\nelse:\n    parent.mkdir(mode=0o700)\n'"'"')'
        printf 'COOKBOOK_BOOTSTRAP_PYTHON=%s\n' "$PRIVATE_PYTHON" >> "$GITHUB_ENV"
        printf '%s\n' 'MISE_AUTO_INSTALL=false' 'MISE_EXEC_AUTO_INSTALL=false' 'MISE_TASK_RUN_AUTO_INSTALL=false' >> "$GITHUB_ENV"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).checkout }}
      with:
        repository: nicodes/cookbook
        ref: ${{ inputs.cookbook-ref }}
        persist-credentials: false
        fetch-depth: 0
        path: .artifacts/recipe-sdks/_cookbook
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).checkout }}
      with:
        repository: nicodes/komizo-actions
        ref: ${{ inputs.komizo-ref }}
        persist-credentials: false
        fetch-depth: 0
        path: _operation_actions
    - name: Prepare accepted recipe SDKs
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).setup }}
      uses: ./_operation_actions/recipe-sources
      with:
        cookbook-ref: ${{ inputs.cookbook-ref }}
    - name: Admit exact trusted main and bounded native operational policy
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).plan }}
      id: plan
      shell: bash
      run: |
        set -euo pipefail
        sdk=(--cookbook-root .artifacts/recipe-sdks/_cookbook --cookbook-ref "$COOKBOOK_REF" --tools-root .artifacts/recipe-sdks/_tools)
        python3 -I -B _operation_actions/scripts/operational.py plan "${sdk[@]}"
    - name: Retain the original protected backup deadline
      shell: bash
      env:
        TOTAL_MINUTES: ${{ inputs.timeout-minutes }}
      run: python3 -I -B _operation_actions/scripts/operation_budget.py --job backup --total-minutes "$TOTAL_MINUTES"
    - uses: ./_operation_actions/connect
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).connect }}
      env:
        KOMIZO_SERVER_URL: ${{ vars.KOMIZO_SERVER_URL }}
        KOMIZO_KNOWN_HOSTS: ${{ vars.KOMIZO_KNOWN_HOSTS }}
        KOMIZO_DEPLOY_KEY: ${{ secrets.KOMIZO_DEPLOY_KEY }}
    - name: Capture only verified encrypted host output
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).capture }}
      id: capture
      shell: bash
      env:
        PROJECT: ${{ steps.plan.outputs.project }}
        BACKUP_CONFIG: ${{ steps.plan.outputs.backup }}
        COOKBOOK_ROOT: ${{ format('{0}/.artifacts/recipe-sdks/_cookbook', github.workspace) }}
        TOOLS_ROOT: ${{ format('{0}/.artifacts/recipe-sdks/_tools', github.workspace) }}
      run: python3 -I -B _operation_actions/scripts/backup.py export --project "$PROJECT" --config "$BACKUP_CONFIG"
    - name: Upload only received encrypted backup
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).upload }}
      if: ${{ steps.capture.outputs.has-export == 'true' }}
      shell: bash
      env:
        PROJECT: ${{ steps.plan.outputs.project }}
        COOKBOOK_ROOT: ${{ format('{0}/.artifacts/recipe-sdks/_cookbook', github.workspace) }}
        TOOLS_ROOT: ${{ format('{0}/.artifacts/recipe-sdks/_tools', github.workspace) }}
        BACKUP_ALLOWED_SLUGS: ${{ steps.plan.outputs['allowed-products'] }}
        BACKUP_S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
        BACKUP_S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
        BACKUP_S3_HOSTNAME: ${{ vars.BACKUP_S3_HOSTNAME }}
        BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
      run: python3 -I -B _operation_actions/scripts/backup.py upload --project "$PROJECT"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).artifact }}
      with:
        name: ${{ steps.plan.outputs['artifact-name'] }}
        path: .artifacts/backup/
        include-hidden-files: true
        if-no-files-found: ${{ steps.plan.outputs['evidence-missing'] || 'error' }}
        retention-days: 30
    name: Capture encrypted backup
  report:
    needs: backup
    if: failure()
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs['report-timeout'] }}
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Require one exact recipe source contract
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).report_setup }}
      shell: bash
      env:
        COOKBOOK_REF: ${{ inputs.cookbook-ref }}
      run: |
        set -euo pipefail
        [[ "$COOKBOOK_REF" =~ ^[a-f0-9]{40}$ ]]
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).report_checkout }}
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 0
    - name: Bootstrap Python for protected SDK sources
      if: ${{ runner.os == 'Windows' && inputs.cookbook-ref != '' }}
      id: sdk-private-python
      timeout-minutes: 5
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      env:
        MISE_AUTO_INSTALL: 'false'
        MISE_EXEC_AUTO_INSTALL: 'false'
        MISE_TASK_RUN_AUTO_INSTALL: 'false'
      with:
        python-version: 3.13.11
        check-latest: false
    - name: Prepare the private artifact parent with actual pinned Python
      if: ${{ runner.os == 'Windows' && inputs.cookbook-ref != '' }}
      timeout-minutes: 1
      shell: bash
      env:
        PRIVATE_PYTHON: ${{ steps.sdk-private-python.outputs.python-path }}
        MISE_AUTO_INSTALL: 'false'
        MISE_EXEC_AUTO_INSTALL: 'false'
        MISE_TASK_RUN_AUTO_INSTALL: 'false'
      run: |
        set -euo pipefail
        "$PRIVATE_PYTHON" -I -B -c 'exec('"'"'import os\nfrom pathlib import Path\nimport stat\nimport sys\nif os.name == "nt" and sys.version_info < (3, 13):\n    raise SystemExit("Windows private SDK directories require the selected Python 3.13 or newer")\nparent = Path.cwd() / ".artifacts"\nfor candidate in [parent, *parent.parents]:\n    try:\n        info = candidate.lstat()\n    except FileNotFoundError:\n        continue\n    if stat.S_ISLNK(info.st_mode) or getattr(info, "st_file_attributes", 0) & 0x400:\n        raise SystemExit("SDK artifact parent must not traverse links or reparse points")\nif parent.exists():\n    if not parent.is_dir():\n        raise SystemExit("SDK artifact parent must be a directory")\nelse:\n    parent.mkdir(mode=0o700)\n'"'"')'
        printf 'COOKBOOK_BOOTSTRAP_PYTHON=%s\n' "$PRIVATE_PYTHON" >> "$GITHUB_ENV"
        printf '%s\n' 'MISE_AUTO_INSTALL=false' 'MISE_EXEC_AUTO_INSTALL=false' 'MISE_TASK_RUN_AUTO_INSTALL=false' >> "$GITHUB_ENV"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).report_checkout }}
      with:
        repository: nicodes/cookbook
        ref: ${{ inputs.cookbook-ref }}
        persist-credentials: false
        fetch-depth: 0
        path: .artifacts/recipe-sdks/_cookbook
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).report_checkout }}
      with:
        repository: nicodes/komizo-actions
        ref: ${{ inputs.komizo-ref }}
        persist-credentials: false
        fetch-depth: 0
        path: _operation_actions
    - name: Prepare accepted recipe SDKs
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).report_setup }}
      uses: ./_operation_actions/recipe-sources
      with:
        cookbook-ref: ${{ inputs.cookbook-ref }}
    - name: Report bounded backup failure
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).report }}
      shell: bash
      env:
        COOKBOOK_REF: ${{ inputs.cookbook-ref }}
      run: |
        tools=.artifacts/recipe-sdks/_tools
        python3 -I -B "$tools/helpers/report-failure.py"
