name: Capture routine encrypted backup
'on':
  workflow_call:
    inputs:
      tools-ref:
        type: string
        required: true
      komizo-ref:
        type: string
        required: true
      declaration:
        type: string
        required: true
      step-timeouts:
        type: string
        required: true
      runner:
        type: string
        required: true
      timeout-minutes:
        type: number
        required: true
      environment:
        type: string
        required: false
        default: ''
      report-timeout:
        type: number
        required: true
    secrets:
      KOMIZO_DEPLOY_KEY:
        required: false
      BACKUP_S3_ACCESS_KEY:
        required: false
      BACKUP_S3_SECRET_KEY:
        required: false
permissions: {}
jobs:
  backup:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs['timeout-minutes'] }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
      attestations: read
    env:
      TOOLS_REF: ${{ inputs.tools-ref }}
      KOMIZO_REF: ${{ inputs.komizo-ref }}
      DECLARATION: ${{ inputs.declaration }}
      OPERATION: backup
      OPERATION_CHECK: ''
      OPERATION_RUNNER: ${{ inputs.runner }}
      OPERATION_TIMEOUT: ${{ inputs['timeout-minutes'] }}
      OPERATION_STEP_TIMEOUTS: ${{ inputs['step-timeouts'] }}
      OPERATION_ENVIRONMENT: ${{ inputs.environment }}
      OPERATION_REPORT_TIMEOUT: ${{ inputs['report-timeout'] }}
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      MISE_AUTO_INSTALL: 'false'
      MISE_EXEC_AUTO_INSTALL: 'false'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.artifacts/playwright
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).checkout }}
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).checkout }}
      with:
        repository: nicodes/tools
        ref: ${{ inputs.tools-ref }}
        persist-credentials: false
        fetch-depth: 0
        path: _operation_cookbook
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).checkout }}
      with:
        repository: nicodes/komizo-actions
        ref: ${{ inputs.komizo-ref }}
        persist-credentials: false
        fetch-depth: 0
        path: _operation_actions
    - name: Prepare the pinned configuration parser
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).setup }}
      uses: nicodes/tools/setup@d475b54c402754a5a37a44fbd65328551995025c
      with:
        tools: python
    - name: Admit exact trusted main and bounded native operational policy
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).plan }}
      id: plan
      shell: bash
      run: python3 _operation_actions/scripts/operational.py plan
    - uses: ./_operation_actions/connect
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).connect }}
      with:
        user: komizo-${{ steps.plan.outputs.project }}
      env:
        KOMIZO_SERVER_URL: ${{ vars.KOMIZO_SERVER_URL }}
        KOMIZO_KNOWN_HOSTS: ${{ vars.KOMIZO_KNOWN_HOSTS }}
        KOMIZO_DEPLOY_KEY: ${{ secrets.KOMIZO_DEPLOY_KEY }}
    - name: Prepare private routine operation frame
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).frame }}
      shell: bash
      run: |
        set -euo pipefail
        install -d -m 700 "$RUNNER_TEMP/komizo-backup-proof"
        printf 'KOMIZO_BACKUP_PROOF_FILE=%s\n' "$RUNNER_TEMP/komizo-backup-proof/operation.frame" >> "$GITHUB_ENV"
    - uses: ./_operation_actions/backup-proof
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).proof }}
      with:
        output: ${{ runner.temp }}/komizo-backup-proof/operation.frame
    - name: Capture only verified encrypted host output
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).capture }}
      id: capture
      shell: bash
      env:
        PROJECT: ${{ steps.plan.outputs.project }}
        BACKUP_CONFIG: ${{ steps.plan.outputs.backup }}
        TOOLS_ROOT: ${{ github.workspace }}/_operation_cookbook
      run: python3 _operation_actions/scripts/backup.py export --project "$PROJECT" --config "$BACKUP_CONFIG"
    - name: Upload only received encrypted backup
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).upload }}
      if: ${{ steps.capture.outputs.has-export == 'true' }}
      shell: bash
      env:
        PROJECT: ${{ steps.plan.outputs.project }}
        TOOLS_ROOT: ${{ github.workspace }}/_operation_cookbook
        BACKUP_ALLOWED_SLUGS: ${{ steps.plan.outputs['allowed-products'] }}
        BACKUP_S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
        BACKUP_S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
        BACKUP_S3_HOSTNAME: ${{ vars.BACKUP_S3_HOSTNAME }}
        BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
      run: python3 _operation_actions/scripts/backup.py upload --project "$PROJECT"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).artifact }}
      with:
        name: ${{ steps.plan.outputs['artifact-name'] }}
        path: .artifacts/backup/
        include-hidden-files: true
        if-no-files-found: ${{ steps.plan.outputs['evidence-missing'] || 'error' }}
        retention-days: 30
    - name: Remove private routine authority frame
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).cleanup }}
      if: always()
      shell: bash
      run: rm -f "$RUNNER_TEMP/komizo-backup-proof/operation.frame"
  report:
    needs: backup
    if: failure()
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs['report-timeout'] }}
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).report_checkout }}
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).report_checkout }}
      with:
        repository: nicodes/tools
        ref: ${{ inputs.tools-ref }}
        persist-credentials: false
        fetch-depth: 0
        path: _operation_cookbook
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).report_checkout }}
      with:
        repository: nicodes/komizo-actions
        ref: ${{ inputs.komizo-ref }}
        persist-credentials: false
        fetch-depth: 0
        path: _operation_actions
    - name: Prepare the pinned report parser
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).report_setup }}
      uses: nicodes/tools/setup@d475b54c402754a5a37a44fbd65328551995025c
      with:
        tools: python
    - name: Report bounded backup failure
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).report }}
      shell: bash
      run: python3 _operation_cookbook/helpers/report-failure.py
