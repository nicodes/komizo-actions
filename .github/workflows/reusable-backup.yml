name: Reusable Backup
'on':
  workflow_call:
    inputs:
      runner:
        description: Runner label selected by the caller
        type: string
        required: false
        default: ubuntu-24.04
      allowed-products:
        description: Reviewed JSON array of permitted backup project slugs
        type: string
        required: true
      product:
        description: Caller-owned project slug naming the backup objects
        type: string
        required: true
      server:
        description: Caller's server URL variable expression (vars.SERVER_HOST or vars.KOMIZO_SERVER_URL)
        type: string
        required: true
      user:
        description: SSH deploy user for the verified-snapshot connection
        type: string
        required: true
    secrets:
      KOMIZO_DEPLOY_KEY:
        description: Repo-level SSH deploy key for the verified-snapshot connection
        required: true
      BACKUP_S3_ACCESS_KEY:
        description: Repo-level object-storage access key for the sealed-pair PUT
        required: true
      BACKUP_S3_SECRET_KEY:
        description: Repo-level object-storage secret key for the sealed-pair PUT
        required: true
permissions:
  contents: read
jobs:
  backup:
    name: Backup
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
      timeout-minutes: 3
    - name: Set up locked komizo
      uses: nicodes/komizo/setup@40086036977a5fc0119d6c4c1d5eb6ae3ab3b4b9
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 5
    - name: Connect to host
      uses: nicodes/komizo-actions/connect@66e672f5786688a5c5fbd492d35ec0009867a250
      env:
        KOMIZO_SERVER_URL: ${{ inputs.server }}
        KOMIZO_DEPLOY_KEY: ${{ secrets.KOMIZO_DEPLOY_KEY }}
        KOMIZO_KNOWN_HOSTS: ${{ vars.KOMIZO_KNOWN_HOSTS }}
      with:
        user: ${{ inputs.user }}
      timeout-minutes: 3
    - name: Prepare bounded routine export authority
      timeout-minutes: 2
      shell: bash
      run: |
        komizo exec --tools python -- bash -euo pipefail <<'KOMIZO_COMMAND'
        set -euo pipefail
        engineering="$CICD_ENGINEERING"
        printf 'CICD_BACKUP_ENGINEERING=%s\n' "$engineering" >> "$GITHUB_ENV"
        install -d -m 700 "$RUNNER_TEMP/komizo-backup-proof"
        proof="$RUNNER_TEMP/komizo-backup-proof/operation.frame"
        python3 "$engineering/helpers/backup-proof.py" --output "$proof"
        printf 'KOMIZO_BACKUP_PROOF_FILE=%s\n' "$proof" >> "$GITHUB_ENV"
        KOMIZO_COMMAND
    - name: Verify and encrypt the pre-deploy snapshot
      timeout-minutes: 15
      run: |-
        komizo exec --tools python -- bash -euo pipefail <<'KOMIZO_COMMAND'
        bash scripts/export-backup.sh
        KOMIZO_COMMAND
    - name: Put the encrypted snapshot in object storage
      timeout-minutes: 10
      env:
        BACKUP_ALLOWED_SLUGS: ${{ inputs.allowed-products }}
        BACKUP_S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
        BACKUP_S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
        BACKUP_S3_HOSTNAME: ${{ vars.BACKUP_S3_HOSTNAME }}
        BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
        BACKUP_PRODUCT: ${{ inputs.product }}
      run: |-
        komizo exec --tools python -- bash -euo pipefail <<'KOMIZO_COMMAND'
        set -euo pipefail
        umask 077
        cms=.artifacts/backup/export/snapshot.cms
        receipt=.artifacts/backup/export/receipt.json
        taken_at="$(python3 - "$receipt" <<'PY'
        import json
        import sys
        from datetime import datetime, timezone
        from pathlib import Path

        path = Path(sys.argv[1])
        try:
            envelope = json.loads(path.read_text())
        except (OSError, UnicodeDecodeError, json.JSONDecodeError) as error:
            raise SystemExit(f'cannot read backup receipt: {error}') from error
        value = envelope.get('verified_at') if isinstance(envelope, dict) else None
        if isinstance(value, str) and value.strip():
            text = value.strip()
            if text.endswith('Z'):
                text = text[:-1] + '+00:00'
            try:
                stamp = datetime.fromisoformat(text)
            except ValueError as error:
                raise SystemExit(f'invalid receipt verified_at: {value!r}') from error
            if stamp.tzinfo is None:
                stamp = stamp.replace(tzinfo=timezone.utc)
            stamp = stamp.astimezone(timezone.utc)
        else:
            stamp = datetime.now(timezone.utc)
        print(stamp.strftime('%Y%m%dT%H%M%SZ'))
        PY
        )"
        python3 "$CICD_BACKUP_ENGINEERING/helpers/upload-backup.py" --slug "$BACKUP_PRODUCT" \
          --cms "$cms" --receipt "$receipt" --taken-at "$taken_at"
        KOMIZO_COMMAND
    - name: Upload artifacts
      timeout-minutes: 10
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: backup-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/backup/export/
        if-no-files-found: error
        retention-days: 30
        include-hidden-files: true
    - name: Remove the private operation proof
      if: always()
      timeout-minutes: 1
      shell: bash
      run: |-
        komizo exec --tools python -- bash -euo pipefail <<'KOMIZO_COMMAND'
        rm -f "$RUNNER_TEMP/komizo-backup-proof/operation.frame"
        KOMIZO_COMMAND
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
  report:
    name: Report failure
    needs:
    - backup
    if: failure()
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      attestations: read
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
      timeout-minutes: 3
    - name: Set up locked komizo
      uses: nicodes/komizo/setup@40086036977a5fc0119d6c4c1d5eb6ae3ab3b4b9
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 5
    - name: Report failure
      run: |
        komizo exec --tools python -- bash -euo pipefail <<'KOMIZO_COMMAND'
        set -euo pipefail
        engineering="$CICD_ENGINEERING"
        python3 "$engineering/helpers/report-failure.py"
        KOMIZO_COMMAND
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 2
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
