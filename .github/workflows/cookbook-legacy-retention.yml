name: Retain existing encrypted legacy recovery pair
'on':
  workflow_call:
    inputs:
      tools-ref:
        type: string
        required: true
      komizo-ref:
        type: string
        required: true
      declaration:
        type: string
        required: true
      step-timeouts:
        type: string
        required: true
      runner:
        type: string
        required: true
      timeout-minutes:
        type: number
        required: true
      environment:
        type: string
        required: false
        default: ''
      run-id:
        type: string
        required: true
      artifact-id:
        type: string
        required: true
permissions: {}
jobs:
  verify:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs['timeout-minutes'] }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      actions: read
      attestations: read
    env:
      TOOLS_REF: ${{ inputs.tools-ref }}
      KOMIZO_REF: ${{ inputs.komizo-ref }}
      DECLARATION: ${{ inputs.declaration }}
      OPERATION: retention
      OPERATION_CHECK: ''
      OPERATION_RUNNER: ${{ inputs.runner }}
      OPERATION_TIMEOUT: ${{ inputs['timeout-minutes'] }}
      OPERATION_STEP_TIMEOUTS: ${{ inputs['step-timeouts'] }}
      OPERATION_ENVIRONMENT: ${{ inputs.environment }}
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      MISE_AUTO_INSTALL: 'false'
      MISE_EXEC_AUTO_INSTALL: 'false'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.artifacts/playwright
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).checkout }}
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).checkout }}
      with:
        repository: nicodes/tools
        ref: ${{ inputs.tools-ref }}
        persist-credentials: false
        fetch-depth: 0
        path: _operation_cookbook
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).checkout }}
      with:
        repository: nicodes/komizo-actions
        ref: ${{ inputs.komizo-ref }}
        persist-credentials: false
        fetch-depth: 0
        path: _operation_actions
    - name: Prepare the pinned configuration parser
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).setup }}
      uses: nicodes/tools/setup@d475b54c402754a5a37a44fbd65328551995025c
      with:
        tools: python
    - name: Admit exact trusted main and bounded native operational policy
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).plan }}
      id: plan
      shell: bash
      run: python3 _operation_actions/scripts/operational.py plan
    - name: Download the explicitly selected immutable encrypted artifact
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).download }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ inputs.artifact-id }}
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.run-id }}
        path: .artifacts/recovery/legacy
    - name: Verify the original encrypted pair and its exact checksum
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).verify }}
      shell: bash
      run: mise exec -- python3 _operation_actions/scripts/legacy_retention.py .artifacts/recovery/legacy
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).artifact }}
      with:
        name: ${{ steps.plan.outputs['artifact-name'] }}
        path: |
          .artifacts/recovery/legacy/pb_data.tar.age
          .artifacts/recovery/legacy/metadata
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 8
