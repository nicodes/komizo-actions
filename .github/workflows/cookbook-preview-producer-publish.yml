name: Publish selected exact-HEAD Preview images
'on':
  workflow_call:
    inputs:
      tools-ref:
        type: string
        required: true
      komizo-ref:
        type: string
        required: true
      plan:
        type: string
        required: true
      runner:
        type: string
        required: true
      timeout-minutes:
        type: number
        required: true
permissions: {}
jobs:
  publish:
    name: Publish selected Preview images
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs['timeout-minutes'] }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
      packages: write
    env:
      TOOLS_REF: ${{ inputs.tools-ref }}
      KOMIZO_REF: ${{ inputs.komizo-ref }}
      PLAN: ${{ inputs.plan }}
      PRODUCER_RUNNER: ${{ inputs.runner }}
      PRODUCER_TIMEOUT: ${{ inputs['timeout-minutes'] }}
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: nicodes/tools
        ref: ${{ inputs.tools-ref }}
        persist-credentials: false
        fetch-depth: 0
        path: _preview_producer_tools
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: nicodes/komizo-actions
        ref: ${{ inputs.komizo-ref }}
        persist-credentials: false
        fetch-depth: 0
        path: _preview_producer_actions
    - name: Revalidate exact request and immutable native policy
      id: plan
      shell: bash
      run: python3 _preview_producer_actions/scripts/preview-producer.py plan
    - name: Inspect exact selected source as data
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ steps.plan.outputs.head }}
        path: _preview_producer_source
        persist-credentials: false
        fetch-depth: 0
    - name: Download same-attempt complete native acceptance
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: cookbook-full-${{ steps.plan.outputs.head }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/preview-producer-input
    - name: Admit archive and publish only the selected component identities
      shell: bash
      run: python3 _preview_producer_actions/scripts/preview-producer.py publish
    - name: Retain exact native producer and selected publication evidence
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: preview-producer-${{ steps.plan.outputs.head }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/preview-producer-publication.json
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
