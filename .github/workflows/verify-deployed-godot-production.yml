name: Verify deployed Godot production
'on':
  workflow_call:
    inputs:
      cookbook-ref:
        required: true
        type: string
      komizo-ref:
        required: true
        type: string
      source:
        required: true
        type: string
      runner:
        required: true
        type: string
      timeout-minutes:
        required: true
        type: number
permissions: {}
jobs:
  verify:
    name: Verify production
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      actions: read
    steps:
    - name: Require exact immutable verification source and accepted automation
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        KOMIZO_REF: ${{ inputs.komizo-ref }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        [[ "$SOURCE" =~ ^[a-f0-9]{40}$ && "$SOURCE" == "$GITHUB_SHA" ]]
        [[ "$KOMIZO_REF" =~ ^[a-f0-9]{40}$ ]]
        relation="$(gh api "repos/nicodes/komizo-actions/compare/$KOMIZO_REF...main" --jq .status)"
        [[ "$relation" == ahead || "$relation" == identical ]]
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Check out deployment actions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: nicodes/komizo-actions
        ref: ${{ inputs.komizo-ref }}
        path: _godot_verification_actions
        persist-credentials: false
    - name: Admit the successful Deploy run this verification follows
      id: deployed
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 -I -B _godot_verification_actions/godot-production/deploy_run.py admit
    - name: Report a deployment that did not become ready
      if: steps.deployed.outputs.artifact == ''
      shell: bash
      run: echo "::notice::The Deploy run retained no public payload identity, so there is no ready public release to verify."
    - name: Download the accepted public payload identity of that Deploy run
      if: steps.deployed.outputs.artifact != ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ${{ steps.deployed.outputs.artifact }}
        run-id: ${{ steps.deployed.outputs.run-id }}
        repository: ${{ github.repository }}
        github-token: ${{ github.token }}
        path: _public_release
    - name: Read the accepted public payload identity
      id: public
      if: steps.deployed.outputs.artifact != ''
      shell: bash
      run: python3 -I -B _godot_verification_actions/godot-production/deploy_run.py read --directory _public_release
    - name: Verify production
      if: steps.public.outputs.release-id != ''
      uses: ./_godot_verification_actions/godot-production
      with:
        cookbook-ref: ${{ inputs.cookbook-ref }}
        source: ${{ inputs.source }}
        release-id: ${{ steps.public.outputs.release-id }}
        runner: ${{ inputs.runner }}
        timeout-minutes: ${{ inputs.timeout-minutes }}
    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always() && steps.public.outputs.release-id != ''
      with:
        name: production-browser-${{ inputs.source }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: release-reports/
        retention-days: 14
        if-no-files-found: error
