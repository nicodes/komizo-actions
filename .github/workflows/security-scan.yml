name: Security Scan
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: security-scan
  cancel-in-progress: false
jobs:
  verify:
    name: Scan dependencies
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up locked Komizo
      uses: nicodes/komizo/setup@2ca94e2fd4bb05f41bb228e9c366e5cc733c75e6
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 5
    - name: Security Scan
      run: komizo run install vuln
    permissions:
      contents: read
      attestations: read
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
