name: Security Scan
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: security-scan
  cancel-in-progress: false
jobs:
  verify:
    name: Scan dependencies
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up locked komizo
      uses: nicodes/komizo/setup@54da2b6d20fda9febf3cd02039424a1a8249cffb
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 5
    - name: Security Scan
      run: komizo run --timeout 7200s security-scan
    permissions:
      contents: read
      attestations: read
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
