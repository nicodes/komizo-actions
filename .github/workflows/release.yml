name: Release
'on':
  workflow_dispatch:
    inputs:
      version:
        description: New immutable version vX.Y.Z
        type: string
        required: true
      sha:
        description: Exact accepted current main commit
        type: string
        required: true
permissions: {}
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      checks: read
      attestations: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      SOURCE: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate exact release transport
        run: |
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Admit complete trusted CI and pack exact source
        run: python3 -I -B scripts/release.py pack "$VERSION" "$SOURCE"
      - name: Attest exact source archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: .artifacts/release/*.tar.gz
      - name: Recheck current main and publish without replacing versions
        run: python3 -I -B scripts/release.py publish "$VERSION" "$SOURCE" --archive ".artifacts/release/komizo-actions-$VERSION.tar.gz"
