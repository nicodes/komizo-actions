name: Release

# Both stages are explicitly manual. Merging a candidate never publishes it.
# This workflow never moves release tags. GitHub release records remain editable.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Manual release stage
        required: true
        type: choice
        options: [prepare, publish]
      version:
        description: Explicit version (vX.Y.Z); unchanged on retries
        required: true
        type: string
      sha:
        description: Full source SHA (prepare) or exact merged SHA (publish)
        required: true
        type: string
      pr:
        description: Merged candidate PR number (publish only)
        required: false
        type: string

permissions: {}
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
      CANDIDATE_SHA: ${{ inputs.sha }}
      CANDIDATE_PR: ${{ inputs.pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Identify release automation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Prepare candidate branch and print operator PR command
        if: inputs.stage == 'prepare'
        run: sh scripts/release.sh prepare "$VERSION" "$CANDIDATE_SHA" --push

      # Keep the dispatch's validator, not executable code from a moving ref.
      - name: Validate merged candidate and check out exact artifact
        if: inputs.stage == 'publish'
        run: |
          set -euo pipefail
          cp scripts/release.py .git/release-control.py
          python3 .git/release-control.py validate "$VERSION" "$CANDIDATE_SHA" --pr "$CANDIDATE_PR"
          git checkout --detach "$CANDIDATE_SHA"

      - name: Test exact merged artifact
        if: inputs.stage == 'publish'
        uses: ./.github/actions/test

      - name: Revalidate and publish without moving tags
        if: inputs.stage == 'publish'
        run: python3 .git/release-control.py publish "$VERSION" "$CANDIDATE_SHA" --pr "$CANDIDATE_PR"
