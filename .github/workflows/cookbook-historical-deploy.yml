name: Deploy an already-published historical application release
'on':
  workflow_call:
    inputs:
      tools-ref:
        type: string
        required: true
      komizo-ref:
        type: string
        required: true
      declaration:
        type: string
        required: true
      version:
        type: string
        required: true
      runner:
        type: string
        required: true
      timeout-minutes:
        type: number
        required: true
      environment:
        type: string
        required: true
      step-timeouts:
        type: string
        required: true
    secrets:
      KOMIZO_DEPLOY_KEY:
        required: true
    outputs:
      version:
        description: Historical release selected by the admitted manual deployment
        value: ${{ jobs.historical.outputs.version }}
permissions: {}
jobs:
  historical:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs['timeout-minutes'] }}
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
    env:
      TOOLS_REF: ${{ inputs.tools-ref }}
      KOMIZO_REF: ${{ inputs.komizo-ref }}
      DECLARATION: ${{ inputs.declaration }}
      HISTORICAL_VERSION: ${{ inputs.version }}
      HISTORICAL_RUNNER: ${{ inputs.runner }}
      HISTORICAL_TIMEOUT: ${{ inputs['timeout-minutes'] }}
      HISTORICAL_ENVIRONMENT: ${{ inputs.environment }}
      HISTORICAL_STEP_TIMEOUTS: ${{ inputs['step-timeouts'] }}
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      MISE_AUTO_INSTALL: 'false'
      MISE_EXEC_AUTO_INSTALL: 'false'
    steps:
    - name: Check out the exact current controller source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).checkout }}
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 0
    - name: Check out the pinned cookbook SDK
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).checkout }}
      with:
        repository: nicodes/tools
        ref: ${{ inputs.tools-ref }}
        path: _historical_cookbook
        persist-credentials: false
        fetch-depth: 0
    - name: Check out the pinned delivery SDK
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).checkout }}
      with:
        repository: nicodes/komizo-actions
        ref: ${{ inputs.komizo-ref }}
        path: _historical_actions
        persist-credentials: false
        fetch-depth: 0
    - name: Prepare only the pinned configuration interpreter
      uses: nicodes/tools/setup@0d59d20fe90e62af905e5e959caafff64ec9d18e
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).setup }}
      with:
        tools: python
    - name: Admit the manual historical release and fixed scoped profile
      id: plan
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).plan }}
      shell: bash
      run: python3 -I _historical_actions/scripts/historical_delivery.py plan
    - name: Authenticate only for registry reads
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).registry }}
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Require every declared historical image before connecting
      id: inspect
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).inspect }}
      shell: bash
      run: python3 -I _historical_actions/scripts/historical_delivery.py inspect
    - name: Submit the historical version to existing scoped host admission
      id: deploy
      uses: ./_historical_actions/deploy
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).deploy }}
      with:
        version: ${{ steps.plan.outputs.version }}
        app: ${{ steps.plan.outputs.project }}
        release-manifest: ''
        service-env-profile: ${{ steps.plan.outputs['service-env-profile'] }}
        expected-generation: ${{ steps.plan.outputs['expected-generation'] }}
        registry-user: ${{ github.actor }}
        registry-token: ${{ github.token }}
        health-urls: ${{ steps.plan.outputs['health-urls'] }}
      env:
        KOMIZO_SERVER_URL: ${{ vars.KOMIZO_SERVER_URL }}
        KOMIZO_KNOWN_HOSTS: ${{ vars.KOMIZO_KNOWN_HOSTS }}
        KOMIZO_DEPLOY_KEY: ${{ secrets.KOMIZO_DEPLOY_KEY }}
    - name: Read bounded diagnostics after an admitted deployment failure
      if: ${{ failure() && steps.inspect.outcome == 'success' && steps.deploy.outcome == 'failure' && steps.plan.outputs.diagnostics == 'true' }}
      continue-on-error: true
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).diagnostics }}
      shell: bash
      env:
        PROJECT: ${{ steps.plan.outputs.project }}
      run: ssh -o BatchMode=yes -o ConnectTimeout=15 deploy-target doas "/usr/local/bin/diagnose-$PROJECT" 200
