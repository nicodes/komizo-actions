name: Deploy an already-published historical application release
'on':
  workflow_call:
    inputs:
      cookbook-ref:
        type: string
        required: false
        default: ''
      tools-ref:
        description: Historical Tools-hosted recipe SDK only
        type: string
        required: false
        default: ''
      komizo-ref:
        type: string
        required: true
      declaration:
        type: string
        required: true
      version:
        type: string
        required: true
      runner:
        type: string
        required: true
      timeout-minutes:
        type: number
        required: true
      environment:
        type: string
        required: true
      step-timeouts:
        type: string
        required: true
    secrets:
      KOMIZO_DEPLOY_KEY:
        required: true
    outputs:
      version:
        description: Historical release selected by the admitted manual deployment
        value: ${{ jobs.historical.outputs.version }}
permissions: {}
jobs:
  historical:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs['timeout-minutes'] }}
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
    env:
      COOKBOOK_REF: ${{ inputs.cookbook-ref }}
      TOOLS_REF: ${{ inputs.tools-ref }}
      KOMIZO_REF: ${{ inputs.komizo-ref }}
      DECLARATION: ${{ inputs.declaration }}
      HISTORICAL_VERSION: ${{ inputs.version }}
      HISTORICAL_RUNNER: ${{ inputs.runner }}
      HISTORICAL_TIMEOUT: ${{ inputs['timeout-minutes'] }}
      HISTORICAL_ENVIRONMENT: ${{ inputs.environment }}
      HISTORICAL_STEP_TIMEOUTS: ${{ inputs['step-timeouts'] }}
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      MISE_AUTO_INSTALL: 'false'
      MISE_EXEC_AUTO_INSTALL: 'false'
    steps:
    - name: Require one exact recipe source contract
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).plan }}
      shell: bash
      env:
        COOKBOOK_REF: ${{ inputs.cookbook-ref }}
        TOOLS_REF: ${{ inputs.tools-ref }}
      run: |
        set -euo pipefail
        if [[ -n "$COOKBOOK_REF" ]]; then
          [[ -z "$TOOLS_REF" && "$COOKBOOK_REF" =~ ^[a-f0-9]{40}$ ]]
        else
          [[ "$TOOLS_REF" =~ ^[a-f0-9]{40}$ ]]
        fi
    - name: Check out the exact current controller source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).checkout }}
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 0
    - name: Bootstrap Python for protected SDK sources
      if: ${{ runner.os == 'Windows' && inputs.cookbook-ref != '' }}
      id: sdk-private-python
      timeout-minutes: 5
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      env:
        MISE_AUTO_INSTALL: 'false'
        MISE_EXEC_AUTO_INSTALL: 'false'
        MISE_TASK_RUN_AUTO_INSTALL: 'false'
      with:
        python-version: '3.13.11'
        check-latest: false
    - name: Prepare the private artifact parent with actual pinned Python
      if: ${{ runner.os == 'Windows' && inputs.cookbook-ref != '' }}
      timeout-minutes: 1
      shell: bash
      env:
        PRIVATE_PYTHON: ${{ steps.sdk-private-python.outputs.python-path }}
        MISE_AUTO_INSTALL: 'false'
        MISE_EXEC_AUTO_INSTALL: 'false'
        MISE_TASK_RUN_AUTO_INSTALL: 'false'
      run: |
        set -euo pipefail
        "$PRIVATE_PYTHON" -I -B -c 'exec('"'"'import os\nfrom pathlib import Path\nimport stat\nimport sys\nif os.name == "nt" and sys.version_info < (3, 13):\n    raise SystemExit("Windows private SDK directories require the selected Python 3.13 or newer")\nparent = Path.cwd() / ".artifacts"\nfor candidate in [parent, *parent.parents]:\n    try:\n        info = candidate.lstat()\n    except FileNotFoundError:\n        continue\n    if stat.S_ISLNK(info.st_mode) or getattr(info, "st_file_attributes", 0) & 0x400:\n        raise SystemExit("SDK artifact parent must not traverse links or reparse points")\nif parent.exists():\n    if not parent.is_dir():\n        raise SystemExit("SDK artifact parent must be a directory")\nelse:\n    parent.mkdir(mode=0o700)\n'"'"')'
        printf 'COOKBOOK_BOOTSTRAP_PYTHON=%s\n' "$PRIVATE_PYTHON" >> "$GITHUB_ENV"
        printf '%s\n' 'MISE_AUTO_INSTALL=false' 'MISE_EXEC_AUTO_INSTALL=false' 'MISE_TASK_RUN_AUTO_INSTALL=false' >> "$GITHUB_ENV"
    - name: Check out the pinned cookbook SDK
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).checkout }}
      with:
        repository: ${{ inputs.cookbook-ref && 'nicodes/cookbook' || 'nicodes/tools' }}
        ref: ${{ inputs.cookbook-ref || inputs.tools-ref }}
        path: ${{ inputs.cookbook-ref && '.artifacts/recipe-sdks/_cookbook' || '_historical_cookbook' }}
        persist-credentials: false
        fetch-depth: 0
    - name: Check out the pinned delivery SDK
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).checkout }}
      with:
        repository: nicodes/komizo-actions
        ref: ${{ inputs.komizo-ref }}
        path: _historical_actions
        persist-credentials: false
        fetch-depth: 0
    - name: Prepare only the pinned configuration interpreter
      if: ${{ inputs.cookbook-ref == '' }}
      uses: nicodes/tools/setup@d475b54c402754a5a37a44fbd65328551995025c
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).setup }}
      with:
        tools: python
    - name: Prepare accepted recipe SDKs
      if: ${{ inputs.cookbook-ref != '' }}
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).setup }}
      uses: ./_historical_actions/recipe-setup
      with:
        cookbook-ref: ${{ inputs.cookbook-ref }}
        tools: python
    - name: Admit the manual historical release and fixed scoped profile
      id: plan
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).plan }}
      shell: bash
      run: |
        set -euo pipefail
        sdk=(--tools _historical_cookbook)
        if [[ -n "$COOKBOOK_REF" ]]; then
          sdk=(--cookbook-root .artifacts/recipe-sdks/_cookbook --cookbook-ref "$COOKBOOK_REF" --tools-root .artifacts/recipe-sdks/_tools)
        fi
        python3 -I _historical_actions/scripts/historical_delivery.py plan "${sdk[@]}"
    - name: Authenticate only for registry reads
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).registry }}
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Require every declared historical image before connecting
      id: inspect
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).inspect }}
      shell: bash
      run: |
        set -euo pipefail
        sdk=(--tools _historical_cookbook)
        if [[ -n "$COOKBOOK_REF" ]]; then
          sdk=(--cookbook-root .artifacts/recipe-sdks/_cookbook --cookbook-ref "$COOKBOOK_REF" --tools-root .artifacts/recipe-sdks/_tools)
        fi
        python3 -I _historical_actions/scripts/historical_delivery.py inspect "${sdk[@]}"
    - name: Submit the historical version to existing scoped host admission
      id: deploy
      uses: ./_historical_actions/deploy
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).deploy }}
      with:
        version: ${{ steps.plan.outputs.version }}
        app: ${{ steps.plan.outputs.project }}
        release-manifest: ''
        service-env-profile: ${{ steps.plan.outputs['service-env-profile'] }}
        expected-generation: ${{ steps.plan.outputs['expected-generation'] }}
        registry-user: ${{ github.actor }}
        registry-token: ${{ github.token }}
        health-urls: ${{ steps.plan.outputs['health-urls'] }}
      env:
        KOMIZO_SERVER_URL: ${{ vars.KOMIZO_SERVER_URL }}
        KOMIZO_KNOWN_HOSTS: ${{ vars.KOMIZO_KNOWN_HOSTS }}
        KOMIZO_DEPLOY_KEY: ${{ secrets.KOMIZO_DEPLOY_KEY }}
    - name: Read bounded diagnostics after an admitted deployment failure
      if: ${{ failure() && steps.inspect.outcome == 'success' && steps.deploy.outcome == 'failure' && steps.plan.outputs.diagnostics == 'true' }}
      continue-on-error: true
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).diagnostics }}
      shell: bash
      env:
        PROJECT: ${{ steps.plan.outputs.project }}
      run: ssh -o BatchMode=yes -o ConnectTimeout=15 deploy-target doas "/usr/local/bin/diagnose-$PROJECT" 200
