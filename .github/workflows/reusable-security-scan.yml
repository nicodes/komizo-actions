name: Reusable Security Scan
'on':
  workflow_call:
    inputs:
      runner:
        description: Runner label selected by the caller
        type: string
        required: false
        default: ubuntu-24.04
      scan-config:
        description: Caller-owned deployed-image scan manifest
        required: false
        type: string
        default: deploy/scan.json
permissions:
  contents: read
  packages: read
  deployments: read
jobs:
  scan:
    name: Scan dependencies
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 110
    permissions:
      contents: read
      packages: read
      deployments: read
      attestations: read
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 5
      with:
        persist-credentials: false
    - name: Set up locked Komizo
      uses: nicodes/komizo/setup@40086036977a5fc0119d6c4c1d5eb6ae3ab3b4b9
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 5
    - name: Log in to container registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
      timeout-minutes: 3
    - name: Scan every source module
      timeout-minutes: 30
      run: komizo run install vuln
    - name: Scan deployed runtime images
      timeout-minutes: 45
      env:
        GH_TOKEN: ${{ github.token }}
        SCAN_CONFIG: ${{ inputs.scan-config }}
      run: |
        komizo exec --tools python -- bash -euo pipefail <<'KOMIZO_COMMAND'
        python3 "$CICD_ENGINEERING/helpers/scan-deployed.py" --config "$SCAN_CONFIG"
        KOMIZO_COMMAND
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
  report:
    name: Report failure
    needs:
    - scan
    if: failure()
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 11
    permissions:
      contents: read
      issues: write
      attestations: read
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up locked Komizo
      uses: nicodes/komizo/setup@40086036977a5fc0119d6c4c1d5eb6ae3ab3b4b9
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 5
    - name: Report failure
      run: |
        komizo exec --tools python -- bash -euo pipefail <<'KOMIZO_COMMAND'
        python3 "$CICD_ENGINEERING"/helpers/report-failure.py
        KOMIZO_COMMAND
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 3
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
