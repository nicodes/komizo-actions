name: Verify historical static Godot release
'on':
  workflow_call:
    inputs:
      cookbook-ref:
        required: false
        type: string
        default: ''
      tools-ref:
        required: false
        type: string
        default: ''
      komizo-ref:
        required: true
        type: string
      source-run-id:
        required: true
        type: string
      runner:
        required: true
        type: string
    outputs:
      proof-sha256:
        value: ${{ jobs.verify.outputs.proof-sha256 }}
permissions: {}
jobs:
  verify:
    name: Verify historical static release
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: read
    outputs:
      proof-sha256: ${{ steps.verify.outputs.proof_sha256 }}
    steps:
    - name: Require accepted immutable recovery automation
      shell: bash
      env:
        COOKBOOK_REF: ${{ inputs.cookbook-ref }}
        TOOLS_REF: ${{ inputs.tools-ref }}
        KOMIZO_REF: ${{ inputs.komizo-ref }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        [[ "$KOMIZO_REF" =~ ^[a-f0-9]{40}$ ]]
        if [[ -n "$COOKBOOK_REF" ]]; then
          [[ -z "$TOOLS_REF" && "$COOKBOOK_REF" =~ ^[a-f0-9]{40}$ ]]
          repository=cookbook; revision="$COOKBOOK_REF"
        else
          [[ "$TOOLS_REF" =~ ^[a-f0-9]{40}$ ]]
          repository=tools; revision="$TOOLS_REF"
        fi
        for pair in "$repository:$revision" "komizo-actions:$KOMIZO_REF"; do
          repository="${pair%%:*}"; revision="${pair#*:}"
          relation="$(gh api "repos/nicodes/$repository/compare/$revision...main" --jq .status)"
          [[ "$relation" == ahead || "$relation" == identical ]]
        done
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Bootstrap Python for protected SDK sources
      if: ${{ runner.os == 'Windows' && inputs.cookbook-ref != '' }}
      id: sdk-private-python
      timeout-minutes: 5
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      env:
        MISE_AUTO_INSTALL: 'false'
        MISE_EXEC_AUTO_INSTALL: 'false'
        MISE_TASK_RUN_AUTO_INSTALL: 'false'
      with:
        python-version: '3.13.11'
        check-latest: false
    - name: Prepare the private artifact parent with actual pinned Python
      if: ${{ runner.os == 'Windows' && inputs.cookbook-ref != '' }}
      timeout-minutes: 1
      shell: bash
      env:
        PRIVATE_PYTHON: ${{ steps.sdk-private-python.outputs.python-path }}
        MISE_AUTO_INSTALL: 'false'
        MISE_EXEC_AUTO_INSTALL: 'false'
        MISE_TASK_RUN_AUTO_INSTALL: 'false'
      run: |
        set -euo pipefail
        "$PRIVATE_PYTHON" -I -B -c 'exec('"'"'import os\nfrom pathlib import Path\nimport stat\nimport sys\nif os.name == "nt" and sys.version_info < (3, 13):\n    raise SystemExit("Windows private SDK directories require the selected Python 3.13 or newer")\nparent = Path.cwd() / ".artifacts"\nfor candidate in [parent, *parent.parents]:\n    try:\n        info = candidate.lstat()\n    except FileNotFoundError:\n        continue\n    if stat.S_ISLNK(info.st_mode) or getattr(info, "st_file_attributes", 0) & 0x400:\n        raise SystemExit("SDK artifact parent must not traverse links or reparse points")\nif parent.exists():\n    if not parent.is_dir():\n        raise SystemExit("SDK artifact parent must be a directory")\nelse:\n    parent.mkdir(mode=0o700)\n'"'"')'
        printf 'COOKBOOK_BOOTSTRAP_PYTHON=%s\n' "$PRIVATE_PYTHON" >> "$GITHUB_ENV"
        printf '%s\n' 'MISE_AUTO_INSTALL=false' 'MISE_EXEC_AUTO_INSTALL=false' 'MISE_TASK_RUN_AUTO_INSTALL=false' >> "$GITHUB_ENV"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ inputs.cookbook-ref && 'nicodes/cookbook' || 'nicodes/tools' }}
        ref: ${{ inputs.cookbook-ref || inputs.tools-ref }}
        path: ${{ inputs.cookbook-ref && '.artifacts/recipe-sdks/_cookbook' || '_godot_recovery_cookbook' }}
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: nicodes/komizo-actions
        ref: ${{ inputs.komizo-ref }}
        path: _godot_recovery_actions
        persist-credentials: false
    - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      if: ${{ inputs.cookbook-ref == '' }}
      with:
        install_args: python
        cache: true
      env:
        MISE_AUTO_INSTALL: 'false'
        MISE_EXEC_AUTO_INSTALL: 'false'
        MISE_GITHUB_TOKEN: ${{ github.token }}
    - name: Prepare accepted recipe SDKs
      if: ${{ inputs.cookbook-ref != '' }}
      uses: ./_godot_recovery_actions/recipe-setup
      with:
        cookbook-ref: ${{ inputs.cookbook-ref }}
        tools: python
    - name: Admit only a successful original main CD source run
      id: source
      shell: bash
      env:
        SOURCE_RUN: ${{ inputs.source-run-id }}
        COOKBOOK_REF: ${{ inputs.cookbook-ref }}
        TOOLS_REF: ${{ inputs.tools-ref }}
        GH_TOKEN: ${{ github.token }}
        MISE_AUTO_INSTALL: 'false'
        MISE_EXEC_AUTO_INSTALL: 'false'
      run: |
        set -euo pipefail
        sdk=(--tools _godot_recovery_cookbook --tools-ref "$TOOLS_REF")
        if [[ -n "$COOKBOOK_REF" ]]; then
          sdk=(--cookbook-root .artifacts/recipe-sdks/_cookbook --cookbook-ref "$COOKBOOK_REF" --tools-root .artifacts/recipe-sdks/_tools)
        fi
        mise exec -- python3 _godot_recovery_actions/godot-static-recovery/recovery.py source "${sdk[@]}" --source-run "$SOURCE_RUN"
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: release-record-${{ steps.source.outputs.sha }}
        path: rollback-record
        run-id: ${{ inputs.source-run-id }}
        github-token: ${{ github.token }}
    - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Explicitly prepare only native recovery SDK capabilities
      shell: bash
      env:
        COOKBOOK_REF: ${{ inputs.cookbook-ref }}
        TOOLS_REF: ${{ inputs.tools-ref }}
        MISE_AUTO_INSTALL: 'false'
        MISE_EXEC_AUTO_INSTALL: 'false'
      run: |
        set -euo pipefail
        sdk=(--tools _godot_recovery_cookbook --tools-ref "$TOOLS_REF")
        if [[ -n "$COOKBOOK_REF" ]]; then
          sdk=(--cookbook-root .artifacts/recipe-sdks/_cookbook --cookbook-ref "$COOKBOOK_REF" --tools-root .artifacts/recipe-sdks/_tools)
        fi
        mise exec -- python3 _godot_recovery_actions/godot-static-recovery/recovery.py setup "${sdk[@]}"
    - name: Recheck exact historical configuration, native delivery, gameplay and current advisories
      id: verify
      shell: bash
      env:
        SOURCE_RUN: ${{ inputs.source-run-id }}
        COOKBOOK_REF: ${{ inputs.cookbook-ref }}
        TOOLS_REF: ${{ inputs.tools-ref }}
        GH_TOKEN: ${{ github.token }}
        MISE_AUTO_INSTALL: 'false'
        MISE_EXEC_AUTO_INSTALL: 'false'
      run: |
        set -euo pipefail
        sdk=(--tools _godot_recovery_cookbook --tools-ref "$TOOLS_REF")
        if [[ -n "$COOKBOOK_REF" ]]; then
          sdk=(--cookbook-root .artifacts/recipe-sdks/_cookbook --cookbook-ref "$COOKBOOK_REF" --tools-root .artifacts/recipe-sdks/_tools)
        fi
        mise exec -- python3 _godot_recovery_actions/godot-static-recovery/recovery.py verify "${sdk[@]}" --source-run "$SOURCE_RUN"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: rollback-verification-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/godot-recovery/acceptance.json
        include-hidden-files: true
        retention-days: 90
        if-no-files-found: warn
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: rollback-reports-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          release-reports/
          .artifacts/reports/security/
        include-hidden-files: true
        retention-days: 90
        if-no-files-found: warn
