name: Verify encrypted recovery transport
'on':
  workflow_call:
    inputs:
      tools-ref:
        type: string
        required: true
      komizo-ref:
        type: string
        required: true
      declaration:
        type: string
        required: true
      step-timeouts:
        type: string
        required: true
      runner:
        type: string
        required: true
      timeout-minutes:
        type: number
        required: true
      environment:
        type: string
        required: false
        default: ''
      source-run-id:
        type: string
        required: true
      artifact-id:
        type: string
        required: true
permissions: {}
jobs:
  verify:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs['timeout-minutes'] }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      actions: read
      attestations: read
    env:
      TOOLS_REF: ${{ inputs.tools-ref }}
      KOMIZO_REF: ${{ inputs.komizo-ref }}
      DECLARATION: ${{ inputs.declaration }}
      OPERATION: recovery
      OPERATION_CHECK: ''
      OPERATION_RUNNER: ${{ inputs.runner }}
      OPERATION_TIMEOUT: ${{ inputs['timeout-minutes'] }}
      OPERATION_STEP_TIMEOUTS: ${{ inputs['step-timeouts'] }}
      OPERATION_ENVIRONMENT: ${{ inputs.environment }}
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      MISE_AUTO_INSTALL: 'false'
      MISE_EXEC_AUTO_INSTALL: 'false'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.artifacts/playwright
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).checkout }}
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).checkout }}
      with:
        repository: nicodes/tools
        ref: ${{ inputs.tools-ref }}
        persist-credentials: false
        fetch-depth: 0
        path: _operation_cookbook
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).checkout }}
      with:
        repository: nicodes/komizo-actions
        ref: ${{ inputs.komizo-ref }}
        persist-credentials: false
        fetch-depth: 0
        path: _operation_actions
    - name: Prepare the pinned configuration parser
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).setup }}
      uses: nicodes/tools/setup@0d59d20fe90e62af905e5e959caafff64ec9d18e
      with:
        tools: python
    - name: Admit exact trusted main and bounded native operational policy
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).plan }}
      id: plan
      shell: bash
      run: python3 _operation_actions/scripts/operational.py plan
    - name: Verify exact completed encrypted transport without restoration
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).verify }}
      uses: ./_operation_actions/recovery-evidence
      with:
        source-run-id: ${{ inputs.source-run-id }}
        artifact-id: ${{ inputs.artifact-id }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      timeout-minutes: ${{ fromJSON(inputs['step-timeouts']).artifact }}
      with:
        name: recovery-transport-${{ github.run_id }}
        path: .artifacts/recovery/transport.json
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
