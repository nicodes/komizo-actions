name: Apply verified Preview lifecycle
'on':
  workflow_call:
    inputs:
      tools-ref:
        type: string
        required: true
      komizo-ref:
        type: string
        required: true
      plan:
        type: string
        required: true
      runner:
        type: string
        required: true
      timeout-minutes:
        type: number
        required: true
    secrets:
      deploy-key:
        required: false
      discord-webhook:
        required: false
      KOMIZO_DEPLOY_KEY:
        required: false
      CLERK_SECRET_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      DISCORD_WEBHOOK_URL:
        required: false
permissions: {}
jobs:
  effects:
    name: Apply verified Preview lifecycle
    environment: Preview
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs['timeout-minutes'] }}
    permissions:
      contents: read
      actions: read
      packages: read
      pull-requests: write
      attestations: read
    env:
      TOOLS_REF: ${{ inputs.tools-ref }}
      KOMIZO_REF: ${{ inputs.komizo-ref }}
      PLAN: ${{ inputs.plan }}
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: nicodes/tools
        ref: ${{ inputs.tools-ref }}
        persist-credentials: false
        fetch-depth: 0
        path: _preview_cookbook
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: nicodes/komizo-actions
        ref: ${{ inputs.komizo-ref }}
        persist-credentials: false
        fetch-depth: 0
        path: _preview_actions
    - name: Revalidate trusted request before host access
      id: plan
      shell: bash
      run: python3 _preview_actions/scripts/preview.py plan
    - name: Download successful same-run publication evidence
      if: ${{ steps.plan.outputs.action == 'up' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: preview-publication-${{ steps.plan.outputs.head }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts
    - name: Require successful exact-source publisher before effects
      if: ${{ steps.plan.outputs.action == 'up' }}
      shell: bash
      run: python3 _preview_actions/scripts/preview.py evidence
    - name: Connect only trusted lifecycle code
      uses: ./_preview_actions/connect
      timeout-minutes: 3
      with:
        user: komizo-${{ steps.plan.outputs.project }}
      env:
        KOMIZO_SERVER_URL: ${{ vars.KOMIZO_SERVER_URL }}
        KOMIZO_DEPLOY_KEY: ${{ secrets.KOMIZO_DEPLOY_KEY || secrets['deploy-key'] }}
        KOMIZO_KNOWN_HOSTS: ${{ vars.KOMIZO_KNOWN_HOSTS }}
    - name: Resolve host-verified public routes
      id: target
      if: ${{ steps.plan.outputs.action == 'up' }}
      uses: ./_preview_actions/preview
      with:
        app: ${{ steps.plan.outputs.project }}
        pr-number: ${{ steps.plan.outputs.pr }}
        images: ${{ steps.plan.outputs.images }}
        action: resolve
    - name: Write bounded development tenant and resolved origin settings
      if: ${{ steps.plan.outputs.action == 'up' && steps.plan.outputs.backend == 'true' }}
      shell: bash
      run: python3 _preview_actions/scripts/preview.py environment
      env:
        PREVIEW_URL: ${{ steps.target.outputs['preview-url'] }}
        API_URL: ${{ steps.target.outputs['api-url'] }}
        PREVIEW_CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        PREVIEW_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
        PREVIEW_OPENROUTER_API_KEY: ${{ steps.plan.outputs.openrouter == 'true' && secrets.OPENROUTER_API_KEY || '' }}
    - name: Recheck current source immediately before preview up
      if: ${{ steps.plan.outputs.action == 'up' }}
      shell: bash
      run: python3 _preview_actions/scripts/preview.py evidence
    - name: Apply preview up or down
      id: preview
      uses: ./_preview_actions/preview
      with:
        app: ${{ steps.plan.outputs.project }}
        pr-number: ${{ steps.plan.outputs.pr }}
        images: ${{ steps.plan.outputs.images }}
        action: ${{ steps.plan.outputs.action }}
        registry-user: ${{ github.actor }}
        registry-token: ${{ steps.plan.outputs.action == 'up' && github.token || '' }}
    - name: Verify exact source readiness on verified routes
      if: ${{ steps.plan.outputs.action == 'up' }}
      shell: bash
      run: python3 _preview_actions/scripts/preview.py health
      env:
        PREVIEW_URL: ${{ steps.preview.outputs['preview-url'] }}
        API_URL: ${{ steps.preview.outputs['api-url'] }}
    - name: Retain label and sticky comment lifecycle
      shell: bash
      run: python3 _preview_actions/scripts/preview.py report
      env:
        PREVIEW_URL: ${{ steps.preview.outputs['preview-url'] }}
        API_URL: ${{ steps.preview.outputs['api-url'] }}
    - name: Announce successful Preview
      if: ${{ steps.plan.outputs.action == 'up' }}
      continue-on-error: true
      timeout-minutes: 1
      uses: ./_preview_actions/notify-discord
      with:
        webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL || secrets['discord-webhook'] }}
        environment: preview
        status: success
        revision: ${{ steps.plan.outputs.head }}
        pr-number: ${{ steps.plan.outputs.pr }}
        deployment-url: ${{ steps.preview.outputs['preview-url'] }}
