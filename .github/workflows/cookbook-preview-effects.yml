name: Apply verified Preview lifecycle
'on':
  workflow_call:
    inputs:
      cookbook-ref:
        type: string
        required: true
      komizo-ref:
        type: string
        required: true
      plan:
        type: string
        required: true
      runner:
        type: string
        required: true
      timeout-minutes:
        type: number
        required: true
    secrets:
      deploy-key:
        required: false
      discord-webhook:
        required: false
      KOMIZO_DEPLOY_KEY:
        required: false
      DISCORD_WEBHOOK_URL:
        required: false
permissions: {}
jobs:
  effects:
    name: Apply verified Preview lifecycle
    environment: Preview
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs['timeout-minutes'] }}
    permissions:
      contents: read
      actions: read
      packages: read
      pull-requests: write
      attestations: read
      id-token: write
    env:
      COOKBOOK_REF: ${{ inputs.cookbook-ref }}
      KOMIZO_REF: ${{ inputs.komizo-ref }}
      PLAN: ${{ inputs.plan }}
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Require one exact recipe source contract
      shell: bash
      run: |
        set -euo pipefail
        [[ "$COOKBOOK_REF" =~ ^[a-f0-9]{40}$ ]]
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 0
    - name: Bootstrap Python for protected SDK sources
      if: ${{ runner.os == 'Windows' && inputs.cookbook-ref != '' }}
      id: sdk-private-python
      timeout-minutes: 5
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      env:
        MISE_AUTO_INSTALL: 'false'
        MISE_EXEC_AUTO_INSTALL: 'false'
        MISE_TASK_RUN_AUTO_INSTALL: 'false'
      with:
        python-version: 3.13.11
        check-latest: false
    - name: Prepare the private artifact parent with actual pinned Python
      if: ${{ runner.os == 'Windows' && inputs.cookbook-ref != '' }}
      timeout-minutes: 1
      shell: bash
      env:
        PRIVATE_PYTHON: ${{ steps.sdk-private-python.outputs.python-path }}
        MISE_AUTO_INSTALL: 'false'
        MISE_EXEC_AUTO_INSTALL: 'false'
        MISE_TASK_RUN_AUTO_INSTALL: 'false'
      run: |
        set -euo pipefail
        "$PRIVATE_PYTHON" -I -B -c 'exec('"'"'import os\nfrom pathlib import Path\nimport stat\nimport sys\nif os.name == "nt" and sys.version_info < (3, 13):\n    raise SystemExit("Windows private SDK directories require the selected Python 3.13 or newer")\nparent = Path.cwd() / ".artifacts"\nfor candidate in [parent, *parent.parents]:\n    try:\n        info = candidate.lstat()\n    except FileNotFoundError:\n        continue\n    if stat.S_ISLNK(info.st_mode) or getattr(info, "st_file_attributes", 0) & 0x400:\n        raise SystemExit("SDK artifact parent must not traverse links or reparse points")\nif parent.exists():\n    if not parent.is_dir():\n        raise SystemExit("SDK artifact parent must be a directory")\nelse:\n    parent.mkdir(mode=0o700)\n'"'"')'
        printf 'COOKBOOK_BOOTSTRAP_PYTHON=%s\n' "$PRIVATE_PYTHON" >> "$GITHUB_ENV"
        printf '%s\n' 'MISE_AUTO_INSTALL=false' 'MISE_EXEC_AUTO_INSTALL=false' 'MISE_TASK_RUN_AUTO_INSTALL=false' >> "$GITHUB_ENV"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: nicodes/cookbook
        ref: ${{ inputs.cookbook-ref }}
        persist-credentials: false
        fetch-depth: 0
        path: .artifacts/recipe-sdks/_cookbook
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: nicodes/komizo-actions
        ref: ${{ inputs.komizo-ref }}
        persist-credentials: false
        fetch-depth: 0
        path: _preview_actions
    - name: Prepare accepted recipe SDKs
      uses: ./_preview_actions/recipe-sources
      with:
        cookbook-ref: ${{ inputs.cookbook-ref }}
    - name: Revalidate trusted request before host access
      id: plan
      shell: bash
      run: |
        set -euo pipefail
        sdk=(--cookbook-root .artifacts/recipe-sdks/_cookbook --cookbook-ref "$COOKBOOK_REF" --tools-root .artifacts/recipe-sdks/_tools)
        python3 -I -B _preview_actions/scripts/preview.py plan "${sdk[@]}"
    - name: Download successful same-run publication evidence
      if: ${{ steps.plan.outputs.action == 'up' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: preview-publication-${{ steps.plan.outputs.head }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts
    - name: Require successful exact-source publisher before effects
      if: ${{ steps.plan.outputs.action == 'up' }}
      shell: bash
      run: |
        set -euo pipefail
        sdk=(--cookbook-root .artifacts/recipe-sdks/_cookbook --cookbook-ref "$COOKBOOK_REF" --tools-root .artifacts/recipe-sdks/_tools)
        python3 -I -B _preview_actions/scripts/preview.py evidence "${sdk[@]}"
    - name: Connect only trusted lifecycle code
      uses: ./_preview_actions/connect
      timeout-minutes: 3
      env:
        KOMIZO_SERVER_URL: ${{ vars.KOMIZO_SERVER_URL }}
        KOMIZO_DEPLOY_KEY: ${{ secrets.KOMIZO_DEPLOY_KEY || secrets['deploy-key'] }}
        KOMIZO_KNOWN_HOSTS: ${{ vars.KOMIZO_KNOWN_HOSTS }}
    - name: Retain the original preview effect deadline
      shell: bash
      env:
        TOTAL_MINUTES: ${{ inputs.timeout-minutes }}
      run: python3 -I -B _preview_actions/scripts/operation_budget.py --job effects --total-minutes "$TOTAL_MINUTES"
    - name: Re-admit exact publication and mint fresh preview authority
      if: steps.plan.outputs.action == 'up'
      shell: bash
      env:
        APPLICATION: ${{ steps.plan.outputs.project }}
        SOURCE: ${{ steps.plan.outputs.head }}
      run: |
        set -euo pipefail
        python3 -I -B -c 'import os; from pathlib import Path; p=Path(".artifacts/preview-plan.json"); p.write_text(os.environ["PLAN"]); p.chmod(0o600)'
        python3 -I -B _preview_actions/scripts/authorize.py --application "$APPLICATION" --source "$SOURCE" --cookbook-root "$COOKBOOK_ROOT" --cookbook-ref "$COOKBOOK_REF" --tools-root "$TOOLS_ROOT" --preview-plan .artifacts/preview-plan.json
    - name: Recheck current source and apply exact preview operation
      id: preview
      shell: bash
      env:
        KOMIZO_REGISTRY_USER: ${{ steps.plan.outputs.action == 'up' && github.repository_owner || '' }}
        KOMIZO_REGISTRY_TOKEN: ${{ steps.plan.outputs.action == 'up' && github.token || '' }}
      run: python3 -I -B _preview_actions/scripts/preview.py apply --cookbook-root .artifacts/recipe-sdks/_cookbook --cookbook-ref
        "$COOKBOOK_REF" --tools-root .artifacts/recipe-sdks/_tools
    - name: Verify exact source readiness on verified routes
      if: ${{ steps.plan.outputs.action == 'up' }}
      shell: bash
      run: |
        set -euo pipefail
        sdk=(--cookbook-root .artifacts/recipe-sdks/_cookbook --cookbook-ref "$COOKBOOK_REF" --tools-root .artifacts/recipe-sdks/_tools)
        python3 -I -B _preview_actions/scripts/preview.py health "${sdk[@]}"
      env:
        PREVIEW_URL: ${{ steps.preview.outputs['preview-url'] }}
        API_URL: ${{ steps.preview.outputs['api-url'] }}
    - name: Retain label and sticky comment lifecycle
      shell: bash
      run: |
        set -euo pipefail
        sdk=(--cookbook-root .artifacts/recipe-sdks/_cookbook --cookbook-ref "$COOKBOOK_REF" --tools-root .artifacts/recipe-sdks/_tools)
        python3 -I -B _preview_actions/scripts/preview.py report "${sdk[@]}"
      env:
        PREVIEW_URL: ${{ steps.preview.outputs['preview-url'] }}
        API_URL: ${{ steps.preview.outputs['api-url'] }}
    - name: Announce successful Preview
      if: ${{ steps.plan.outputs.action == 'up' }}
      continue-on-error: true
      timeout-minutes: 1
      uses: ./_preview_actions/notify-discord
      with:
        webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL || secrets['discord-webhook'] }}
        environment: preview
        status: success
        revision: ${{ steps.plan.outputs.head }}
        pr-number: ${{ steps.plan.outputs.pr }}
        deployment-url: ${{ steps.preview.outputs['preview-url'] }}
