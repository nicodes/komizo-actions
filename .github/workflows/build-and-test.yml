name: Build and test
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  push:
    branches:
    - main
  merge_group: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  ci:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Set up development tools
      uses: nicodes/tools/setup@48fb94fd811c3594489aa3af34f94903cfdb48f7
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 5
    - name: Record tested integration identity
      if: github.event_name == 'pull_request'
      env:
        EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      shell: bash
      run: python3 "$TOOLS_ROOT/helpers/integration-identity.py"
    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: github.event_name == 'pull_request'
      with:
        name: fleet-integration-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/fleet-integration.json
        if-no-files-found: error
        retention-days: 7
        include-hidden-files: true
    - name: Prepare frozen authority counterexamples
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 1
      with:
        repository: nicodes/tools
        ref: d475b54c402754a5a37a44fbd65328551995025c
        path: .artifacts/recipe-legacy-test-sdk
        persist-credentials: false
    - name: Prepare an obsolete SDK for explicit native reader refusals
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 1
      with:
        repository: nicodes/tools
        ref: 14dd4792df910b8f72ae10bf01c7e426b97b667e
        path: .artifacts/recipe-test-sdk
        fetch-depth: 1
        persist-credentials: false
    - name: Prepare the accepted native Cookbook source for recipe controls
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 1
      with:
        repository: nicodes/cookbook
        ref: 878c66558effe5e0d6772873a96ed75a147ec525
        path: .artifacts/recipe-task-sdk
        fetch-depth: 1
        persist-credentials: false
    - name: Prepare the Cookbook provider's exact Tools dependency
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 1
      with:
        repository: nicodes/tools
        ref: 48fb94fd811c3594489aa3af34f94903cfdb48f7
        path: .artifacts/recipe-task-tools
        fetch-depth: 1
        persist-credentials: false
    - name: Prepare the accepted format 2 transport SDK for real envelope controls
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 1
      with:
        repository: nicodes/tools
        ref: 7873bb0fdae1726295dbf7f9317c58daa374b2a6
        path: .artifacts/recovery-transport-sdk
        fetch-depth: 1
        persist-credentials: false
    - name: Test
      shell: bash
      run: |-
        set -euo pipefail
        mise run check
    permissions:
      contents: read
      attestations: read
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
      REQUIRE_CLEAN_HISTORY: ${{ !github.event.repository.private }}
      RECIPE_LEGACY_TEST_SDK: ${{ github.workspace }}/.artifacts/recipe-legacy-test-sdk
      RECIPE_TEST_SDK: ${{ github.workspace }}/.artifacts/recipe-test-sdk
      RECIPE_CONTRACT_TEST_SDK: ${{ github.workspace }}/.artifacts/recipe-task-sdk
      RECIPE_CONTRACT_TEST_SDK_REF: 878c66558effe5e0d6772873a96ed75a147ec525
      RECIPE_SOURCE_SDK: ${{ github.workspace }}/.artifacts/recovery-transport-sdk
      RECIPE_SOURCE_SDK_REF: 7873bb0fdae1726295dbf7f9317c58daa374b2a6
      RECIPE_TASK_SDK: ${{ github.workspace }}/.artifacts/recipe-task-sdk
      RECIPE_TASK_SDK_REF: 878c66558effe5e0d6772873a96ed75a147ec525
      RECIPE_TASK_TOOLS: ${{ github.workspace }}/.artifacts/recipe-task-tools
      RECOVERY_TEST_TOOLS: ${{ github.workspace }}/.artifacts/recovery-transport-sdk

  build-test:
    name: Build and test
    if: always()
    needs: [ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
    - name: Require the complete current source validation
      timeout-minutes: 1
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        python3 -I -B - <<'PYTHON'
        import json
        import os

        raw = os.environ['RESULTS']
        if len(raw.encode()) > 32768:
            raise SystemExit('Source dependency results exceed their finite bound')
        def unique(pairs):
            result = {}
            for key, value in pairs:
                if key in result:
                    raise ValueError('Duplicate source dependency result field')
                result[key] = value
            return result
        results = json.loads(raw, object_pairs_hook=unique)
        if not isinstance(results, dict) or set(results) != {'ci'}:
            raise SystemExit('Build and test requires the complete canonical dependency set')
        test = results['ci']
        if (not isinstance(test, dict) or set(test) != {'result', 'outputs'}
                or not isinstance(test['outputs'], dict) or test['result'] != 'success'):
            raise SystemExit('Incomplete current source validation')
        print('Complete current source validation passed')
        PYTHON
