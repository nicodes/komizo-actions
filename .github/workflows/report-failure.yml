name: Report failure
'on':
  workflow_call:
    inputs:
      cookbook-ref:
        type: string
        required: true
      komizo-ref:
        type: string
        required: true
      runner:
        type: string
        required: true
      timeout-minutes:
        type: number
        required: true
      step-timeouts:
        type: string
        required: true
permissions: {}
jobs:
  report:
    name: Report failure
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      issues: write
    steps:
    - name: Require one exact recipe source contract
      timeout-minutes: ${{ fromJSON(inputs.step-timeouts).setup }}
      shell: bash
      env:
        COOKBOOK_REF: ${{ inputs.cookbook-ref }}
        KOMIZO_REF: ${{ inputs.komizo-ref }}
      run: |
        set -euo pipefail
        [[ "$COOKBOOK_REF" =~ ^[a-f0-9]{40}$ && "$KOMIZO_REF" =~ ^[a-f0-9]{40}$ ]]
        [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
        [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ && "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
        [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
        [[ "$GITHUB_REF" == refs/heads/main ]]
        [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch || "$GITHUB_EVENT_NAME" == workflow_run ]]
        case "$GITHUB_WORKFLOW_REF" in
          "$GITHUB_REPOSITORY/.github/workflows/security.yml@refs/heads/main")
            [[ "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch ]] ;;
          "$GITHUB_REPOSITORY/.github/workflows/deploy.yml@refs/heads/main")
            [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ]] ;;
          "$GITHUB_REPOSITORY/.github/workflows/verify-production.yml@refs/heads/main")
            [[ "$GITHUB_EVENT_NAME" == workflow_run || "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch ]] ;;
          *) exit 1 ;;
        esac
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: ${{ fromJSON(inputs.step-timeouts).checkout }}
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Bootstrap Python for protected SDK sources
      if: ${{ runner.os == 'Windows' }}
      id: sdk-private-python
      timeout-minutes: 5
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      env:
        MISE_AUTO_INSTALL: 'false'
        MISE_EXEC_AUTO_INSTALL: 'false'
        MISE_TASK_RUN_AUTO_INSTALL: 'false'
      with:
        python-version: 3.13.11
        check-latest: false
    - name: Prepare the private artifact parent with actual pinned Python
      if: ${{ runner.os == 'Windows' }}
      timeout-minutes: 1
      shell: bash
      env:
        PRIVATE_PYTHON: ${{ steps.sdk-private-python.outputs.python-path }}
        MISE_AUTO_INSTALL: 'false'
        MISE_EXEC_AUTO_INSTALL: 'false'
        MISE_TASK_RUN_AUTO_INSTALL: 'false'
      run: |
        set -euo pipefail
        "$PRIVATE_PYTHON" -I -B -c 'exec('"'"'import os\nfrom pathlib import Path\nimport stat\nimport sys\nif os.name == "nt" and sys.version_info < (3, 13):\n    raise SystemExit("Windows private SDK directories require the selected Python 3.13 or newer")\nparent = Path.cwd() / ".artifacts"\nfor candidate in [parent, *parent.parents]:\n    try:\n        info = candidate.lstat()\n    except FileNotFoundError:\n        continue\n    if stat.S_ISLNK(info.st_mode) or getattr(info, "st_file_attributes", 0) & 0x400:\n        raise SystemExit("SDK artifact parent must not traverse links or reparse points")\nif parent.exists():\n    if not parent.is_dir():\n        raise SystemExit("SDK artifact parent must be a directory")\nelse:\n    parent.mkdir(mode=0o700)\n'"'"')'
        printf 'COOKBOOK_BOOTSTRAP_PYTHON=%s\n' "$PRIVATE_PYTHON" >> "$GITHUB_ENV"
        printf '%s\n' 'MISE_AUTO_INSTALL=false' 'MISE_EXEC_AUTO_INSTALL=false' 'MISE_TASK_RUN_AUTO_INSTALL=false' >> "$GITHUB_ENV"
    - name: Check out Cookbook
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: ${{ fromJSON(inputs.step-timeouts).checkout }}
      with:
        repository: nicodes/cookbook
        ref: ${{ inputs.cookbook-ref }}
        path: .artifacts/recipe-sdks/_cookbook
        persist-credentials: false
    - name: Check out deployment actions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: ${{ fromJSON(inputs.step-timeouts).checkout }}
      with:
        repository: nicodes/komizo-actions
        ref: ${{ inputs.komizo-ref }}
        path: _delivery_actions
        persist-credentials: false
    - name: Prepare accepted recipe SDKs
      timeout-minutes: ${{ fromJSON(inputs.step-timeouts).setup }}
      uses: ./_delivery_actions/recipe-setup
      with:
        cookbook-ref: ${{ inputs.cookbook-ref }}
        tools: python
    - name: Report failure
      timeout-minutes: ${{ fromJSON(inputs.step-timeouts).report }}
      env:
        GH_TOKEN: ${{ github.token }}
        COOKBOOK_REF: ${{ inputs.cookbook-ref }}
      run: |
        python3 -I -B .artifacts/recipe-sdks/_tools/helpers/report-failure.py
