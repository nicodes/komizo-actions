name: Build & Test
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  ci:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up development tools
      uses: nicodes/tools/setup@d475b54c402754a5a37a44fbd65328551995025c
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 5
    - name: Record tested integration identity
      if: github.event_name == 'pull_request'
      env:
        EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      shell: bash
      run: python3 "$TOOLS_ROOT/helpers/integration-identity.py"
    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: github.event_name == 'pull_request'
      with:
        name: fleet-integration-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/fleet-integration.json
        if-no-files-found: error
        retention-days: 7
        include-hidden-files: true
    - name: Prepare the accepted recipe SDK for canonical reader controls
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 1
      with:
        repository: nicodes/tools
        ref: 14dd4792df910b8f72ae10bf01c7e426b97b667e
        path: .artifacts/recipe-test-sdk
        fetch-depth: 1
        persist-credentials: false
    - name: Prepare the accepted strict recipe SDK for definition controls
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 1
      with:
        repository: nicodes/tools
        ref: 6391cdae4f0ead355a43de161f0dbadd22168f62
        path: .artifacts/recipe-contract-test-sdk
        fetch-depth: 1
        persist-credentials: false
    - name: Test
      shell: bash
      run: |-
        set -euo pipefail
        mise run check
    permissions:
      contents: read
      attestations: read
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
      RECIPE_TEST_SDK: ${{ github.workspace }}/.artifacts/recipe-test-sdk
      RECIPE_CONTRACT_TEST_SDK: ${{ github.workspace }}/.artifacts/recipe-contract-test-sdk
      RECIPE_CONTRACT_TEST_SDK_REF: 6391cdae4f0ead355a43de161f0dbadd22168f62
