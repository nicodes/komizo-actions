name: Notify Discord
description: Send a deployment result without changing the deployment outcome.
inputs:
  webhook-url:
    description: Discord channel webhook, supplied from secrets.DISCORD_WEBHOOK_URL.
    required: true
  app:
    description: Deprecated; the title uses the GitHub repository name.
    required: false
  environment:
    description: production or preview.
    required: true
  status:
    description: success or failure. Preview failure is intentionally silent.
    required: true
  revision:
    description: Deployed commit SHA.
    default: ${{ github.sha }}
  pr-number:
    description: Preview pull request number.
    default: ''
  preview-url:
    description: Public preview URL after health checks pass.
    default: ''
  deployment-url:
    description: Public production or preview URL to visit. Preview falls back to preview-url.
    default: ''
  details:
    description: Deprecated; compact messages contain links only.
    default: ''
runs:
  using: composite
  steps:
    - name: Send deployment result
      continue-on-error: true
      shell: bash
      env:
        DISCORD_WEBHOOK_URL: ${{ inputs.webhook-url }}
        NOTIFY_ENVIRONMENT: ${{ inputs.environment }}
        NOTIFY_STATUS: ${{ inputs.status }}
        NOTIFY_REVISION: ${{ inputs.revision }}
        NOTIFY_PR: ${{ inputs.pr-number }}
        NOTIFY_PREVIEW_URL: ${{ inputs.preview-url }}
        NOTIFY_DEPLOYMENT_URL: ${{ inputs.deployment-url }}
      run: python3 "$GITHUB_ACTION_PATH/send.py"
