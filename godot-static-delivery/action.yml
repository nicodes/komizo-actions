name: Deliver accepted static Godot release
description: Preserve immutable gate and config images, original host admission and rollback records
inputs:
  cookbook-ref:
    description: Accepted nicodes/cookbook source commit
    required: false
    default: ''
  tools-ref:
    description: Historical Tools-hosted recipe SDK only
    required: false
    default: ''
  source:
    description: Exact final main source commit
    required: true
outputs:
  release-id:
    description: Exact ordinary public payload identity
    value: ${{ steps.publication.outputs.release-id }}
  gate-ref:
    description: Verified immutable game image
    value: ${{ steps.publication.outputs.gate-ref }}
  config-ref:
    description: Verified immutable static host configuration
    value: ${{ steps.publication.outputs.config-ref }}
runs:
  using: composite
  steps:
  - name: Refuse obsolete deployment before registry or host effects
    shell: bash
    run: python3 "$GITHUB_ACTION_PATH/../scripts/require-current-deployment.py"
    env:
      GH_TOKEN: ${{ github.token }}
  - name: Require accepted immutable static delivery inputs
    shell: bash
    env:
      SOURCE: ${{ inputs.source }}
      COOKBOOK_REF: ${{ inputs.cookbook-ref }}
      TOOLS_REF: ${{ inputs.tools-ref }}
      GH_TOKEN: ${{ github.token }}
    run: |
      set -euo pipefail
      [[ "$SOURCE" =~ ^[a-f0-9]{40}$ && "$SOURCE" == "$GITHUB_SHA" && "$GITHUB_REF" == refs/heads/main ]]
      if [[ -n "$COOKBOOK_REF" ]]; then
        [[ -z "$TOOLS_REF" && "$COOKBOOK_REF" =~ ^[a-f0-9]{40}$ ]]
        repository=cookbook; revision="$COOKBOOK_REF"
      else
        [[ "$TOOLS_REF" =~ ^[a-f0-9]{40}$ ]]
        repository=tools; revision="$TOOLS_REF"
      fi
      relation="$(gh api "repos/nicodes/$repository/compare/$revision...main" --jq .status)"
      [[ "$relation" == ahead || "$relation" == identical ]]
  - name: Bootstrap Python for protected SDK sources
    if: ${{ runner.os == 'Windows' && inputs.cookbook-ref != '' }}
    id: sdk-private-python
    uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
    env:
      MISE_AUTO_INSTALL: 'false'
      MISE_EXEC_AUTO_INSTALL: 'false'
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
    with:
      python-version: '3.13.11'
      check-latest: false
  - name: Prepare the private artifact parent with actual pinned Python
    if: ${{ runner.os == 'Windows' && inputs.cookbook-ref != '' }}
    shell: bash
    env:
      PRIVATE_PYTHON: ${{ steps.sdk-private-python.outputs.python-path }}
      MISE_AUTO_INSTALL: 'false'
      MISE_EXEC_AUTO_INSTALL: 'false'
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
    run: |
      set -euo pipefail
      "$PRIVATE_PYTHON" -I -B -c 'exec('"'"'import os\nfrom pathlib import Path\nimport stat\nimport sys\nif os.name == "nt" and sys.version_info < (3, 13):\n    raise SystemExit("Windows private SDK directories require the selected Python 3.13 or newer")\nparent = Path.cwd() / ".artifacts"\nfor candidate in [parent, *parent.parents]:\n    try:\n        info = candidate.lstat()\n    except FileNotFoundError:\n        continue\n    if stat.S_ISLNK(info.st_mode) or getattr(info, "st_file_attributes", 0) & 0x400:\n        raise SystemExit("SDK artifact parent must not traverse links or reparse points")\nif parent.exists():\n    if not parent.is_dir():\n        raise SystemExit("SDK artifact parent must be a directory")\nelse:\n    parent.mkdir(mode=0o700)\n'"'"')'
      printf 'COOKBOOK_BOOTSTRAP_PYTHON=%s\n' "$PRIVATE_PYTHON" >> "$GITHUB_ENV"
      printf '%s\n' 'MISE_AUTO_INSTALL=false' 'MISE_EXEC_AUTO_INSTALL=false' 'MISE_TASK_RUN_AUTO_INSTALL=false' >> "$GITHUB_ENV"
  - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    with:
      repository: ${{ inputs.cookbook-ref && 'nicodes/cookbook' || 'nicodes/tools' }}
      ref: ${{ inputs.cookbook-ref || inputs.tools-ref }}
      path: ${{ inputs.cookbook-ref && '.artifacts/recipe-sdks/_cookbook' || '_godot_static_cookbook' }}
      persist-credentials: false
  - uses: ./_godot_static_cookbook/setup
    if: ${{ inputs.cookbook-ref == '' }}
    with:
      tools: python
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
  - name: Inspect the host configuration parser without SDK imports
    id: recipe_host
    if: ${{ inputs.cookbook-ref != '' }}
    shell: bash
    env:
      MISE_AUTO_INSTALL: 'false'
      MISE_EXEC_AUTO_INSTALL: 'false'
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
    run: |
      "${COOKBOOK_BOOTSTRAP_PYTHON:-python3}" -I -B -c 'import sys; print("bootstrap-python=" + str(sys.version_info < (3, 11)).lower())' >> "$GITHUB_OUTPUT"
  - name: Bootstrap the exact supported configuration parser
    if: ${{ (inputs.cookbook-ref != '') && steps.recipe_host.outputs.bootstrap-python == 'true' }}
    uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
    with:
      python-version: '3.13.11'
      check-latest: false
  - name: Admit both real sources before Cookbook SDK execution
    if: ${{ inputs.cookbook-ref != '' }}
    shell: bash
    env:
      COOKBOOK_REF: ${{ inputs.cookbook-ref }}
      GH_TOKEN: ${{ github.token }}
      MISE_AUTO_INSTALL: 'false'
      MISE_EXEC_AUTO_INSTALL: 'false'
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
    run: |
      "${COOKBOOK_BOOTSTRAP_PYTHON:-python3}" -I -B "$GITHUB_ACTION_PATH/../scripts/recipe_context.py" dependency --cookbook-root .artifacts/recipe-sdks/_cookbook --cookbook-ref "$COOKBOOK_REF"
  - name: Prepare only the checked Cookbook provider dependency
    if: ${{ inputs.cookbook-ref != '' }}
    uses: ./.artifacts/recipe-sdks/_cookbook/sdk-dependencies
    with:
      cookbook-ref: ${{ inputs.cookbook-ref }}
  - name: Explicitly prepare the selected exact caller SDKs
    if: ${{ inputs.cookbook-ref != '' }}
    uses: ./.artifacts/recipe-sdks/_cookbook/sdk-setup
    with:
      tools: python
  - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
    with:
      name: cookbook-full-${{ inputs.source }}-${{ github.run_id }}-${{ github.run_attempt }}
      path: .artifacts/delivery-input
  - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
    with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ github.token }}
  - name: Publish verified game and exact static host configuration
    id: publication
    shell: bash
    env:
      SOURCE: ${{ inputs.source }}
      COOKBOOK_REF: ${{ inputs.cookbook-ref }}
      TOOLS_REF: ${{ inputs.tools-ref }}
      GH_TOKEN: ${{ github.token }}
      MISE_AUTO_INSTALL: 'false'
      MISE_EXEC_AUTO_INSTALL: 'false'
    run: |
      set -euo pipefail
      sdk=(--tools _godot_static_cookbook --tools-ref "$TOOLS_REF")
      if [[ -n "$COOKBOOK_REF" ]]; then
        sdk=(--cookbook-root .artifacts/recipe-sdks/_cookbook --cookbook-ref "$COOKBOOK_REF" --tools-root .artifacts/recipe-sdks/_tools)
      fi
      mise exec -- python3 "$GITHUB_ACTION_PATH/publish.py" "${sdk[@]}" --source "$SOURCE"
  - name: Normalize the original static gate artifact identity
    uses: nicodes/komizo-actions/release-evidence@6aebd7bde3aa5a68efd9c79df0cee3a29beb1be8
    with:
      version: ${{ inputs.source }}
      kind: gate-artifact
      image-base: ghcr.io/${{ github.repository }}
      expected-gate-id: ${{ steps.publication.outputs.gate-id }}
  - name: Recheck current main before host activation
    shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    run: python3 "$GITHUB_ACTION_PATH/../scripts/require-current-deployment.py"
  - name: Activate the accepted source through the existing host policy
    uses: nicodes/komizo-actions/deploy@6aebd7bde3aa5a68efd9c79df0cee3a29beb1be8
    with:
      release-manifest: .artifacts/komizo-release/manifest.json
      version: ${{ inputs.source }}
      registry-user: ${{ github.actor }}
      registry-token: ${{ github.token }}
      health-urls: ${{ steps.publication.outputs.health-urls }}
  - name: Retain the original successful-CD immutable release record
    if: steps.publication.outputs.record == 'true'
    uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
    with:
      name: release-record-${{ inputs.source }}
      path: release-record.json
      retention-days: 90
      if-no-files-found: error
