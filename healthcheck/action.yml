name: Health check (deprecated)
description: >
  Renamed to `health-check`, so every action here is spelled the same way.
  This forwards to it unchanged and will be removed.

  Change `healthcheck` to `health-check` in your workflow. Nothing else moves:
  the inputs, the outputs and the behaviour are the same.

inputs:
  url:
    description: URL to poll.
    required: true
  expect:
    description: Substring the response body must contain. Empty means any 2xx counts.
    required: false
    default: ""
  attempts:
    description: How many times to try before giving up.
    required: false
    default: "30"
  delay:
    description: Seconds between attempts.
    required: false
    # Mirrors health-check's defaults exactly. A shim that restates a default
    # and gets it wrong changes behaviour for every caller who omitted the
    # input, silently, which is worse than not having a shim.
    default: "5"
  timeout:
    description: Seconds to allow each individual request.
    required: false
    default: "10"

outputs:
  attempts-used:
    description: How many attempts it took to answer. Empty if it never did.
    value: ${{ steps.fwd.outputs.attempts-used }}

runs:
  using: composite
  steps:
    - name: Say it moved
      shell: bash
      run: |
        echo "::notice::komizo-actions/healthcheck is now komizo-actions/health-check. This forwards for now; update the ref."

    - name: Forward to health-check
      id: fwd
      uses: nicodes/komizo-actions/health-check@3c672d1d56621d57bf0038e8e3b1b777880eb8d6
      with:
        url: ${{ inputs.url }}
        expect: ${{ inputs.expect }}
        attempts: ${{ inputs.attempts }}
        delay: ${{ inputs.delay }}
        timeout: ${{ inputs.timeout }}
