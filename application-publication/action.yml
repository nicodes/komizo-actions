name: Publish accepted application images
description: Publish exact closed images admitted by same-run full Make validation
inputs:
  tools-ref:
    description: Accepted cookbook source commit
    required: true
  komizo-ref:
    description: Accepted Komizo automation source commit
    required: true
  source:
    description: Exact final source revision
    required: true
  project:
    description: Application slug
    required: true
runs:
  using: composite
  steps:
  - name: Require accepted immutable automation before publication
    shell: bash
    run: "set -euo pipefail\n[[ \"$SOURCE\" =~ ^[a-f0-9]{40}$ && \"$SOURCE\" == \"\
      $GITHUB_SHA\" && \"$GITHUB_REF\" == refs/heads/main ]]\n[[ \"$TOOLS_REF\" =~\
      \ ^[a-f0-9]{40}$ && \"$KOMIZO_REF\" =~ ^[a-f0-9]{40}$ && \"$PROJECT\" =~ ^[a-z][a-z0-9-]{0,62}$\
      \ ]]\nfor pair in \"tools:$TOOLS_REF\" \"komizo-actions:$KOMIZO_REF\"; do\n\
      \  repository=\"${pair%%:*}\"\n  revision=\"${pair#*:}\"\n  relation=\"$(gh\
      \ api \"repos/nicodes/$repository/compare/$revision...main\" --jq .status)\"\
      \n  [[ \"$relation\" == ahead || \"$relation\" == identical ]]\ndone\n"
    env:
      SOURCE: ${{ inputs.source }}
      TOOLS_REF: ${{ inputs.tools-ref }}
      KOMIZO_REF: ${{ inputs.komizo-ref }}
      PROJECT: ${{ inputs.project }}
      GH_TOKEN: ${{ github.token }}
  - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    with:
      ref: ${{ inputs.source }}
      fetch-depth: 0
      persist-credentials: false
  - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    with:
      repository: nicodes/tools
      ref: ${{ inputs.tools-ref }}
      path: _delivery_cookbook
      persist-credentials: false
  - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    with:
      repository: nicodes/komizo-actions
      ref: ${{ inputs.komizo-ref }}
      path: _komizo
      persist-credentials: false
  - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
    with:
      name: cookbook-full-${{ inputs.source }}-${{ github.run_id }}-${{ github.run_attempt
        }}
      path: .artifacts/delivery-input
  - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
    with:
      registry: ghcr.io
      username: ${{ github.repository_owner }}
      password: ${{ github.token }}
  - name: Publish exact images from successful full validation
    shell: bash
    run: python3 _komizo/scripts/application-publication.py --source "$SOURCE" --tools
      _delivery_cookbook --tools-ref "$TOOLS_REF" --project "$PROJECT"
    env:
      SOURCE: ${{ inputs.source }}
      TOOLS_REF: ${{ inputs.tools-ref }}
      KOMIZO_REF: ${{ inputs.komizo-ref }}
      PROJECT: ${{ inputs.project }}
      GH_TOKEN: ${{ github.token }}
  - uses: ./_komizo/release-evidence
    with:
      version: ${{ inputs.source }}
      kind: publication
      source: .artifacts/release/publication.json
  - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
    with:
      name: host-release-${{ inputs.source }}
      path: .artifacts/komizo-release/manifest.json
      if-no-files-found: error
      include-hidden-files: true
      retention-days: 7
