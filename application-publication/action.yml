name: Publish accepted application images
description: Publish exact closed images admitted by same-run full recipe validation
inputs:
  cookbook-ref:
    description: Accepted standalone Cookbook source commit
    required: true
  komizo-ref:
    description: Accepted Komizo automation source commit
    required: true
  source:
    description: Exact final source revision
    required: true
  project:
    description: Application slug
    required: true
  source-prepared:
    description: Exact clean product source was checked out before this action
    required: false
    default: 'false'
runs:
  using: composite
  steps:
  - name: Require accepted immutable automation before publication
    shell: bash
    run: |
      set -euo pipefail
      [[ "$SOURCE_PREPARED" == true || "$SOURCE_PREPARED" == false ]]
      [[ "$SOURCE" =~ ^[a-f0-9]{40}$ && "$SOURCE" == "$GITHUB_SHA" && "$GITHUB_REF" == refs/heads/main ]]
      [[ "$KOMIZO_REF" =~ ^[a-f0-9]{40}$ && "$PROJECT" =~ ^[a-z][a-z0-9-]{0,62}$ ]]
      [[ "$COOKBOOK_REF" =~ ^[a-f0-9]{40}$ ]]
      recipe_source="cookbook:$COOKBOOK_REF"
      for pair in "$recipe_source" "komizo-actions:$KOMIZO_REF"; do
        repository="${pair%%:*}"
        revision="${pair#*:}"
        relation="$(gh api "repos/nicodes/$repository/compare/$revision...main" --jq .status)"
        [[ "$relation" == ahead || "$relation" == identical ]]
      done
    env:
      SOURCE: ${{ inputs.source }}
      COOKBOOK_REF: ${{ inputs.cookbook-ref }}
      KOMIZO_REF: ${{ inputs.komizo-ref }}
      PROJECT: ${{ inputs.project }}
      SOURCE_PREPARED: ${{ inputs.source-prepared }}
      GH_TOKEN: ${{ github.token }}
  - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    if: inputs.source-prepared != 'true'
    with:
      ref: ${{ inputs.source }}
      fetch-depth: 0
      persist-credentials: false
  - name: Verify prepared product source before publication
    shell: bash
    run: |
      set -euo pipefail
      [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
      [[ "$(git rev-parse --show-toplevel)" == "$GITHUB_WORKSPACE" ]]
      [[ "$(git rev-parse HEAD)" == "$SOURCE" ]]
      git diff --quiet HEAD --
      origin="$(git remote get-url origin)"
      [[ "$origin" == "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" || "$origin" == "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" ]]
      [[ "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" == "$SOURCE" ]]
    env:
      SOURCE: ${{ inputs.source }}
      GH_TOKEN: ${{ github.token }}
  - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    with:
      repository: nicodes/cookbook
      ref: ${{ inputs.cookbook-ref }}
      path: .artifacts/automation/cookbook
      persist-credentials: false
  - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    with:
      repository: nicodes/komizo-actions
      ref: ${{ inputs.komizo-ref }}
      path: _komizo
      persist-credentials: false
  - name: Resolve the accepted Cookbook helper dependency
    id: sdk-tools
    shell: bash
    run: python3 -I -B _komizo/scripts/recipe_context.py dependency --cookbook-root .artifacts/automation/cookbook --cookbook-ref
      "$COOKBOOK_REF" --github-output
    env:
      COOKBOOK_REF: ${{ inputs.cookbook-ref }}
      GH_TOKEN: ${{ github.token }}
  - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    with:
      repository: nicodes/tools
      ref: ${{ steps.sdk-tools.outputs.tools-ref }}
      path: .artifacts/automation/tools
      persist-credentials: false
  - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
    with:
      name: cookbook-full-${{ inputs.source }}-${{ github.run_id }}-${{ github.run_attempt }}
      path: .artifacts/delivery-input
  - name: Publish exact images from successful full validation
    shell: bash
    run: |
      set -euo pipefail
      arguments=(--cookbook-root .artifacts/automation/cookbook --cookbook-ref "$COOKBOOK_REF" --tools-root .artifacts/automation/tools)
      python3 -I -B _komizo/scripts/application-publication.py --source "$SOURCE" "${arguments[@]}" --project "$PROJECT"
    env:
      SOURCE: ${{ inputs.source }}
      COOKBOOK_REF: ${{ inputs.cookbook-ref }}
      KOMIZO_REF: ${{ inputs.komizo-ref }}
      PROJECT: ${{ inputs.project }}
      GH_TOKEN: ${{ github.token }}
      KOMIZO_REGISTRY_USER: ${{ github.repository_owner }}
      KOMIZO_REGISTRY_TOKEN: ${{ github.token }}
  - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
    with:
      name: host-release-${{ inputs.source }}-${{ github.run_id }}-${{ github.run_attempt }}
      path: .artifacts/komizo-release/
      if-no-files-found: error
      include-hidden-files: true
      retention-days: 7
