name: Prepare pinned submission transport
description: Prepare a private job key and strict host pins for the fixed Komizo submission account
inputs:
  host:
    description: SSH host; defaults to KOMIZO_SERVER_URL
    default: ''
  key:
    description: Submission private key; defaults to KOMIZO_DEPLOY_KEY
    default: ''
  known-hosts:
    description: Verified SSH host key lines; defaults to KOMIZO_KNOWN_HOSTS
    default: ''
  port:
    description: SSH port
    default: '22'
outputs:
  ssh-config:
    description: Private configuration used by the typed submission client
runs:
  using: node24
  main: connect.cjs
  post: cleanup.cjs
  post-if: always()
