name: Connect to the deploy target
description: >
  Install a deploy key and a PINNED host key, then expose the server as the
  ssh alias "deploy-target". Fails closed if the host key is not pinned.

  Run this before deploy, set-secrets or activate — they all ride the alias
  it leaves behind. So can your own steps: `ssh deploy-target ...` works in any
  later step, which is the hook for anything this toolkit does not cover.

  It verifies the connection before finishing, so a wrong key or user fails
  here rather than midway through a deploy. Put it first in the job and a bad
  credential costs you nothing else.

inputs:
  host:
    description: >
      Hostname or IP of the server. Falls back to the KOMIZO_SERVER_URL environment
      variable, the name komizo tells you to store it under.
    required: false
    default: ""
  user:
    description: Deploy account on the server, `komizo-<app>` unless you overrode it.
    required: true
  key:
    description: >
      Private half of the deploy key. Pass a secret.

      Optional because it falls back to the KOMIZO_DEPLOY_KEY environment
      variable, which is the name komizo tells you to store it under. A
      composite action cannot read `secrets` itself -- GitHub only exposes that
      context to workflows -- so the fallback is an env var the caller sets
      once on the job rather than an input threaded through every step.
    required: false
    default: ""
  known-hosts:
    description: >
      The server's host keys as known_hosts LINES, which is what komizo copies
      when you press `h` on an app's row. Required unless allow-unpinned-host
      is true.

      Falls back to the KOMIZO_KNOWN_HOSTS environment variable, for the same
      reason as `key` above.
    required: false
    default: ""
  port:
    description: SSH port.
    required: false
    default: "22"
  allow-unpinned-host:
    description: >
      Discover the host key with ssh-keyscan at deploy time instead of pinning
      it. This is trust-on-first-use on EVERY run: anyone who can influence DNS
      or routing from the runner collects whatever this job sends. Opt in only
      for throwaway hosts.
    required: false
    default: "false"

outputs:
  host:
    description: The host this connected to. Echoes the input, for chaining.
    value: ${{ steps.verify.outputs.host }}

runs:
  using: composite
  steps:
    - name: Install deploy key and host key
      id: install
      shell: bash
      # Inputs arrive as env vars, never as ${{ }} inside the script. Direct
      # interpolation pastes the secret into the shell source, where a backtick
      # or $(...) in a key would execute on the runner and GitHub's log masking
      # cannot see it.
      env:
        SSH_HOST: ${{ inputs.host }}
        SSH_USER: ${{ inputs.user }}
        # The input wins; the environment is the fallback. Written this way
        # round so an explicit input is never silently overridden by a variable
        # left set on the job.
        SSH_KEY: ${{ inputs.key }}
        SSH_KNOWN_HOSTS: ${{ inputs.known-hosts }}
        SSH_PORT: ${{ inputs.port }}
        ALLOW_UNPINNED: ${{ inputs.allow-unpinned-host }}
      run: |
        set -euo pipefail

        # komizo's own names, used when the caller passed nothing. This is what
        # lets a workflow set them once under env: and never mention them again.
        : "${SSH_HOST:=${KOMIZO_SERVER_URL:-}}"
        # A hostname, not a URL, whatever the variable is called. Strip a
        # scheme and anything after the host rather than failing on it: ssh
        # takes "komizo.example.com", and "https://komizo.example.com/" is the
        # obvious thing to paste into something named _URL.
        SSH_HOST="${SSH_HOST#*://}"
        SSH_HOST="${SSH_HOST%%/*}"
        : "${SSH_KEY:=${KOMIZO_DEPLOY_KEY:-}}"
        : "${SSH_KNOWN_HOSTS:=${KOMIZO_KNOWN_HOSTS:-}}"

        if [ -z "$SSH_HOST" ]; then
          echo "::error::No host. Pass 'host:', or set KOMIZO_SERVER_URL under env: on the job."
          exit 1
        fi

        if [ -z "$SSH_KEY" ]; then
          echo "::error::No deploy key. Pass 'key:', or set KOMIZO_DEPLOY_KEY under env: on the job — komizo prints the value when you add an app or rotate its key. Environment-scoped secrets are invisible to jobs without that environment."
          exit 1
        fi

        # These three are written into ~/.ssh/config below, and ssh_config is a
        # line-oriented format with directives that RUN THINGS -- ProxyCommand
        # among them. A newline in any of them stops being a bad hostname and
        # becomes arbitrary code on this runner. They are repository variables
        # rather than attacker input, which is why this is a guard and not an
        # emergency, but the values are constrained on the komizo side and there
        # is no reason for them not to be constrained here.
        case "$SSH_HOST" in
          *[!A-Za-z0-9.:_-]*)
            echo "::error::host contains characters that are not valid in a hostname: '$SSH_HOST'"
            exit 1 ;;
        esac
        case "$SSH_USER" in
          ''|*[!A-Za-z0-9._-]*)
            echo "::error::user must be letters, digits, dot, underscore or hyphen; got '$SSH_USER'."
            exit 1 ;;
        esac
        case "$SSH_PORT" in
          ''|*[!0-9]*)
            echo "::error::port must be a number; got '$SSH_PORT'."
            exit 1 ;;
        esac

        # Per-job SSH state lives under $RUNNER_TEMP, not ~/.ssh. On a
        # self-hosted or otherwise reused runner ~/.ssh persists between jobs:
        # id_deploy and a lingering ControlMaster socket would hand the key and a
        # still-authenticated channel to whatever runs next as the same user, and
        # socket reuse skips host-key verification entirely. $RUNNER_TEMP is
        # per-job, so the key, the pins and the socket all share the job's
        # lifetime. Only the deploy-target alias itself is left in ~/.ssh/config,
        # pointing at the files here -- that is the documented seam later steps
        # ride.
        komizo_dir="$RUNNER_TEMP/komizo"
        mkdir -p "$komizo_dir"
        chmod 700 "$komizo_dir"

        mkdir -p ~/.ssh
        chmod 700 ~/.ssh

        # umask before the redirect, not chmod after it: `> file` creates it with
        # the default mask (0644) and it stays world-readable for the statement
        # until `chmod 600` runs -- a window a reused runner can lose. Scoped to
        # a subshell so the mask does not outlive the write.
        (umask 077; printf '%s\n' "$SSH_KEY" > "$komizo_dir/id_deploy")
        chmod 600 "$komizo_dir/id_deploy"

        if [ -n "$SSH_KNOWN_HOSTS" ]; then
          # Appended, not written over. A job that connects to two servers --
          # deploying an app that spans them, or copying between them -- used to
          # keep only the pins of whichever ran last, and the earlier host then
          # failed verification with its keys sitting in a file it had been
          # removed from.
          touch "$komizo_dir/known_hosts"
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> "$komizo_dir/known_hosts"
          chmod 600 "$komizo_dir/known_hosts"
          # Catch a bad paste here rather than as an opaque "Host key
          # verification failed" on the first connection. The value must be
          # known_hosts LINES ("<host> <keytype> <base64>"), which is what
          # ssh-keyscan prints — not the server's .pub file, which has no
          # hostname field and so matches no host.
          if ! ssh-keygen -F "[$SSH_HOST]:$SSH_PORT" -f "$komizo_dir/known_hosts" >/dev/null 2>&1 \
             && ! ssh-keygen -F "$SSH_HOST" -f "$komizo_dir/known_hosts" >/dev/null 2>&1; then
            lines=$(grep -cve '^[[:space:]]*$' "$komizo_dir/known_hosts" || true)
            fields=$(awk '!/^[[:space:]]*($|#)/ {print $1}' "$komizo_dir/known_hosts" | sort -u | paste -sd',' -)
            echo "::error::known-hosts contains no entry for $SSH_HOST ($lines non-empty line(s); first fields: ${fields:-none}). If those look like key types (ssh-ed25519, ssh-rsa, ecdsa-*), you pasted the server's .pub file — it has no hostname field. Re-capture with 'ssh-keyscan -p $SSH_PORT $SSH_HOST' and verify the base64 against the host's /etc/ssh/ssh_host_*_key.pub."
            exit 1
          fi
          # Only key types are echoed, no key material.
          echo "Pinned host keys for $SSH_HOST: $(awk '!/^[[:space:]]*($|#)/ {print $2}' "$komizo_dir/known_hosts" | sort -u | paste -sd',' -)"
        elif [ "$ALLOW_UNPINNED" = "true" ]; then
          echo "::warning::Host key not pinned — trusting whatever answers on $SSH_HOST:$SSH_PORT. Anything this job sends the server is exposed to whoever can influence DNS or routing from the runner."
          touch "$komizo_dir/known_hosts"
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> "$komizo_dir/known_hosts" 2>/dev/null
          chmod 600 "$komizo_dir/known_hosts"
        else
          echo "::error::No host keys. Pass 'known-hosts:', or set KOMIZO_KNOWN_HOSTS under env: on the job — komizo copies the value when you press 'h' on the app's row. Store it as a repository VARIABLE rather than a secret: it is not confidential, and leaving it unmasked keeps a host-key mismatch legible in the log. To skip pinning anyway, set allow-unpinned-host: true."
          exit 1
        fi

        # Drop any existing deploy-target block before writing ours, so running
        # this action twice does not leave two. The match is on any Host line
        # whose whitespace-separated tokens INCLUDE deploy-target, not the exact
        # line `Host deploy-target` -- a planted `Host deploy-target somethingelse`
        # names our alias too and has to be dropped, or it survives earlier in
        # the file and wins.
        touch ~/.ssh/config
        awk '
          $1 == "Host" {
            drop = 0
            for (i = 2; i <= NF; i++) if ($i == "deploy-target") drop = 1
            if (drop) next
          }
          !drop
        ' ~/.ssh/config > ~/.ssh/config.tmp

        # IdentitiesOnly: offer id_deploy and nothing else. Without it ssh also
        # offers agent and default keys, and sshd cuts the connection at
        # MaxAuthTries — so "this account cannot log in" arrives as "Too many
        # authentication failures" instead.
        # BatchMode: never wait on a password prompt with no one to answer it.
        #
        # ControlMaster: one connection for the whole job. A deploy opens a
        # session per step and set-secrets opens one PER SECRET, each paying a
        # full handshake and authentication against a box on the other side of
        # the internet. They ride the connection the verify step below opens.
        # ControlPersist is short: the socket is an authenticated channel to the
        # host, so it should outlive the last step by as little as possible.
        #
        # PREPENDED, not appended: ssh takes the FIRST value it sees for each
        # parameter, so a pre-existing `Host *` earlier in the file (with its own
        # HostName/ProxyCommand/`StrictHostKeyChecking no`) would otherwise win
        # and silently redirect or unpin this connection. Ours goes first.
        #
        # IdentityFile/UserKnownHostsFile/ControlPath all point under
        # $RUNNER_TEMP/komizo -- see the note above the key write. The block here
        # is the only ssh state left in the shared ~/.ssh, and it just names the
        # per-job files.
        #
        # A composite action cannot declare a `post:` step, so this leaves no
        # automatic cleanup. On ephemeral runners the job's teardown removes
        # $RUNNER_TEMP and ~/.ssh for you; on a SELF-HOSTED or reused runner add
        # a final `if: always()` step to close the socket and drop the state --
        # see docs/actions.md ("Cleanup on self-hosted runners").
        cat > ~/.ssh/config.new <<CFG
        Host deploy-target
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile $komizo_dir/id_deploy
            UserKnownHostsFile $komizo_dir/known_hosts
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ControlMaster auto
            ControlPath $komizo_dir/control-%C
            ControlPersist 1m
        CFG
        cat ~/.ssh/config.tmp >> ~/.ssh/config.new
        rm -f ~/.ssh/config.tmp
        mv ~/.ssh/config.new ~/.ssh/config
        chmod 600 ~/.ssh/config

        # Resolved here so the verify step below, and the deploy action's
        # output, do not each repeat the fallback and the scheme-stripping.
        echo "host=$SSH_HOST" >> "$GITHUB_OUTPUT"

    - name: Verify connectivity
      id: verify
      shell: bash
      env:
        SSH_HOST: ${{ steps.install.outputs.host }}
      run: |
        set -euo pipefail
        if ! ssh deploy-target true; then
          echo "::error::Cannot open an SSH session as the deploy user. Check the public half of this key is in that user's authorized_keys on the server, and that sshd is reachable on the configured port."
          exit 1
        fi
        echo "host=$SSH_HOST" >> "$GITHUB_OUTPUT"
        echo "Connected to deploy-target."
