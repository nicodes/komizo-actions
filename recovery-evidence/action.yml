name: Verify backup transport
description: Verify an immutable backup artifact and retain nonsecret transport evidence without decrypting or restoring it.
inputs:
  source-run-id:
    description: Exact completed main backup or deployment run ID
    required: true
  artifact-id:
    description: Exact unexpired encrypted backup artifact ID
    required: true
  directory:
    description: Caller checkout in which to retain nonsecret recovery evidence
    required: false
    default: .
runs:
  using: composite
  steps:
  - name: Select reviewed transport helpers
    uses: nicodes/tools/helpers@0f95a6df60f740b527596ed2c7f4590e3f2d5820
  - name: Verify immutable artifact transport
    shell: bash
    env:
      PROJECT_DIRECTORY: ${{ inputs.directory }}
      SOURCE_RUN_ID: ${{ inputs.source-run-id }}
      SOURCE_ARTIFACT_ID: ${{ inputs.artifact-id }}
      GH_TOKEN: ${{ github.token }}
    run: |-
      cd "$PROJECT_DIRECTORY" || exit
      python3 "$GITHUB_ACTION_PATH/evidence.py"
