name: "Set secrets"
description: >
  Push secret values to the host's write-only secret store. Requires the
  connect action to have run first.

  Values are read from the step's ENVIRONMENT, not from `with:` — an action
  input is recorded in the workflow run and visible in the API, and would also
  land in the process list.

  Name each one KOMIZO_SECRET_<NAME> and it is pushed as <NAME>:

      env:
        KOMIZO_SECRET_DATABASE_URL: <the secrets.DATABASE_URL expression>
        KOMIZO_SECRET_STRIPE_KEY:   <the secrets.STRIPE_KEY expression>

  A composite action cannot read the `secrets` context itself — GitHub exposes
  it to workflows only — so a value has to arrive as an environment variable.
  The prefix is what makes that env block the whole declaration: it says which
  secrets exist AND which ones the host gets, in one place, so there is no
  second list to keep in agreement with it.

  What the host receives is exactly what is written here and nothing else,
  which is the property worth protecting. Everything else in the job's
  environment stays out of it.

inputs:
  names:
    description: >
      Newline-separated secret names, for values passed as plain environment
      variables under their own names rather than with the KOMIZO_SECRET_
      prefix. Use it for a value computed during the job.

      Leave it empty — the normal case — and the KOMIZO_SECRET_* variables on
      the step are the list.
    required: false
    default: ""
  command:
    description: >
      Privileged secret command on the host, as installed by `komizo`. Named
      after the app, e.g. `doas /usr/local/bin/set-secret-blog`.
    required: true

  release-manifest:
    description: Verified source and image manifest for an atomic authenticated secret set.
    required: false
    default: ""

outputs:
  count:
    description: How many secrets were set.
    value: ${{ steps.push.outputs.count }}

runs:
  using: composite
  steps:
    - name: Push secrets
      id: push
      shell: bash
      env:
        NAMES: ${{ inputs.names }}
        SECRET_CMD: ${{ inputs.command }}
        RELEASE_MANIFEST: ${{ inputs.release-manifest }}
      run: python3 "$GITHUB_ACTION_PATH/push.py"
