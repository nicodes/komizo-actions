[tools]
"python" = "3.13.11"
"bun" = "1.4.1"
"actionlint" = "1.7.12"
"shellcheck" = "0.11.0"

[env]
TOOLS_ROOT = "{{ get_env(name='TOOLS_ROOT', default=config_root ~ '/.ci-tools') }}"
GOTOOLCHAIN = "local"
PYTHONDONTWRITEBYTECODE = "1"

[tasks."lint"]
run = ["bash scripts/with-python.sh bash scripts/lint.sh"]

[tasks."unit"]
run = "python3 \"$TOOLS_ROOT/helpers/verification.py\" test --name unit --artifact .artifacts/build -- mise run _unit"
depends = ["install"]

[tasks."install"]
run = ["bash scripts/install.sh"]

[tasks."integration"]
run = "python3 \"$TOOLS_ROOT/helpers/verification.py\" test --name integration --artifact .artifacts/build -- mise run _integration"
depends = ["install"]

[tasks."dependency-maintenance"]
run = ["python3 \"$TOOLS_ROOT/helpers/watch-tools.py\""]

[tasks."security-scan"]
run = ["bash -euo pipefail -c 'python3 -m venv \"$RUNNER_TEMP/fleet-security-scan\"\n\"$RUNNER_TEMP/fleet-security-scan/bin/python\" -m pip install --disable-pip-version-check pip-audit==2.10.1\n\"$RUNNER_TEMP/fleet-security-scan/bin/python\" -m pip_audit -r check-secrets/requirements.txt'"]

[tasks."_unit"]
run = ["bash scripts/with-python.sh python3 -m unittest discover -s tests -v"]
hide = true

[tasks."_integration"]
run = ["bash scripts/with-python.sh bash scripts/integration.sh"]
hide = true

[tasks."_test-stages"]
run = [{"task" = "unit"}, {"task" = "integration"}]
hide = true

[tasks."test"]
run = "python3 \"$TOOLS_ROOT/helpers/verification.py\" session --test unit --test integration -- mise run _test-stages"

[tasks."_check-stages"]
run = [{"task" = "install"}, {"task" = "lint"}, {"task" = "unit"}, {"task" = "integration"}]
hide = true

[tasks."check"]
run = "python3 \"$TOOLS_ROOT/helpers/verification.py\" session --test unit --test integration -- mise run _check-stages"
