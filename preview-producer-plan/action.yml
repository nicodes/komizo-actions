name: Preserve an opt-in exact-HEAD Preview producer
description: Resolve the existing lifecycle and bind source publication to reviewed native policy
inputs:
  cookbook-ref:
    description: Accepted immutable nicodes/cookbook source
    required: false
    default: ''
  tools-ref:
    description: Historical Tools-hosted recipe SDK only
    required: false
    default: ''
  komizo-ref:
    description: Accepted immutable producer source
    required: true
  declaration:
    description: Tracked native publication policy
    required: true
outputs:
  enabled:
    description: Existing lifecycle decision
    value: ${{ steps.plan.outputs.enabled || steps.request.outputs.enabled }}
  action:
    description: Existing up or down lifecycle
    value: ${{ steps.plan.outputs.action || steps.request.outputs.action }}
  pr:
    description: Same-repository pull request
    value: ${{ steps.plan.outputs.pr || steps.request.outputs.pr }}
  sha:
    description: Exact selected source commit
    value: ${{ steps.plan.outputs.sha || steps.request.outputs.sha }}
  base:
    description: Exact current trusted-main source
    value: ${{ steps.plan.outputs.base }}
  plan:
    description: Closed immutable source and publication authority
    value: ${{ steps.plan.outputs.plan }}
  build-runner:
    description: Original source producer runner
    value: ${{ steps.plan.outputs.build_runner }}
  build-timeout:
    description: Original source producer deadline
    value: ${{ steps.plan.outputs.build_timeout }}
  publish-runner:
    description: Original publication runner
    value: ${{ steps.plan.outputs.publish_runner }}
  publish-timeout:
    description: Original producer job ceiling
    value: ${{ steps.plan.outputs.publish_timeout }}
  publication-timeout:
    description: Original publication command deadline
    value: ${{ steps.plan.outputs.publication_timeout }}
runs:
  using: composite
  steps:
    - name: Resolve the independent opt-in lifecycle
      id: request
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 "$GITHUB_ACTION_PATH/../scripts/preview-producer.py" resolve
    - name: Require one exact recipe source contract
      if: steps.request.outputs.enabled == 'true' && steps.request.outputs.action == 'up'
      shell: bash
      env:
        COOKBOOK_REF: ${{ inputs.cookbook-ref }}
        TOOLS_REF: ${{ inputs.tools-ref }}
      run: |
        set -euo pipefail
        if [[ -n "$COOKBOOK_REF" ]]; then
          [[ -z "$TOOLS_REF" && "$COOKBOOK_REF" =~ ^[a-f0-9]{40}$ ]]
        else
          [[ "$TOOLS_REF" =~ ^[a-f0-9]{40}$ ]]
        fi
    - name: Check out trusted caller policy only for up
      if: steps.request.outputs.enabled == 'true' && steps.request.outputs.action == 'up'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 0
    - name: Bootstrap Python for protected SDK sources
      if: ${{ runner.os == 'Windows' && inputs.cookbook-ref != '' && (steps.request.outputs.enabled == 'true' && steps.request.outputs.action == 'up') }}
      id: sdk-private-python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      env:
        MISE_AUTO_INSTALL: 'false'
        MISE_EXEC_AUTO_INSTALL: 'false'
        MISE_TASK_RUN_AUTO_INSTALL: 'false'
      with:
        python-version: '3.13.11'
        check-latest: false
    - name: Prepare the private artifact parent with actual pinned Python
      if: ${{ runner.os == 'Windows' && inputs.cookbook-ref != '' && (steps.request.outputs.enabled == 'true' && steps.request.outputs.action == 'up') }}
      shell: bash
      env:
        PRIVATE_PYTHON: ${{ steps.sdk-private-python.outputs.python-path }}
        MISE_AUTO_INSTALL: 'false'
        MISE_EXEC_AUTO_INSTALL: 'false'
        MISE_TASK_RUN_AUTO_INSTALL: 'false'
      run: |
        set -euo pipefail
        "$PRIVATE_PYTHON" -I -B -c 'exec('"'"'import os\nfrom pathlib import Path\nimport stat\nimport sys\nif os.name == "nt" and sys.version_info < (3, 13):\n    raise SystemExit("Windows private SDK directories require the selected Python 3.13 or newer")\nparent = Path.cwd() / ".artifacts"\nfor candidate in [parent, *parent.parents]:\n    try:\n        info = candidate.lstat()\n    except FileNotFoundError:\n        continue\n    if stat.S_ISLNK(info.st_mode) or getattr(info, "st_file_attributes", 0) & 0x400:\n        raise SystemExit("SDK artifact parent must not traverse links or reparse points")\nif parent.exists():\n    if not parent.is_dir():\n        raise SystemExit("SDK artifact parent must be a directory")\nelse:\n    parent.mkdir(mode=0o700)\n'"'"')'
        printf 'COOKBOOK_BOOTSTRAP_PYTHON=%s\n' "$PRIVATE_PYTHON" >> "$GITHUB_ENV"
        printf '%s\n' 'MISE_AUTO_INSTALL=false' 'MISE_EXEC_AUTO_INSTALL=false' 'MISE_TASK_RUN_AUTO_INSTALL=false' >> "$GITHUB_ENV"
    - name: Check out accepted source SDK only for up
      if: steps.request.outputs.enabled == 'true' && steps.request.outputs.action == 'up'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ inputs.cookbook-ref && 'nicodes/cookbook' || 'nicodes/tools' }}
        ref: ${{ inputs.cookbook-ref || inputs.tools-ref }}
        path: ${{ inputs.cookbook-ref && '.artifacts/recipe-sdks/_cookbook' || '_preview_producer_tools' }}
        persist-credentials: false
        fetch-depth: 0
    - name: Check out accepted producer only for up
      if: steps.request.outputs.enabled == 'true' && steps.request.outputs.action == 'up'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: nicodes/komizo-actions
        ref: ${{ inputs.komizo-ref }}
        path: _preview_producer_actions
        persist-credentials: false
        fetch-depth: 0
    - name: Prepare accepted recipe SDKs
      if: ${{ inputs.cookbook-ref != '' && steps.request.outputs.enabled == 'true' && steps.request.outputs.action == 'up' }}
      uses: ./_preview_producer_actions/recipe-setup
      with:
        cookbook-ref: ${{ inputs.cookbook-ref }}
        tools: python
    - name: Admit the exact selected-HEAD source producer
      id: plan
      if: steps.request.outputs.enabled == 'true' && steps.request.outputs.action == 'up'
      shell: bash
      env:
        COOKBOOK_REF: ${{ inputs.cookbook-ref }}
        TOOLS_REF: ${{ inputs.tools-ref }}
        KOMIZO_REF: ${{ inputs.komizo-ref }}
        DECLARATION: ${{ inputs.declaration }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        sdk=(--tools _preview_producer_tools)
        if [[ -n "$COOKBOOK_REF" ]]; then
          sdk=(--cookbook-root .artifacts/recipe-sdks/_cookbook --cookbook-ref "$COOKBOOK_REF" --tools-root .artifacts/recipe-sdks/_tools)
        fi
        python3 _preview_producer_actions/scripts/preview-producer.py request --declaration "$DECLARATION" "${sdk[@]}"
