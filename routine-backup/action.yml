name: Capture routine encrypted backup
description: Keep routine operation authority, capture, immutable upload and cleanup in the caller's existing backup job
inputs:
  tools-ref:
    description: Accepted full cookbook source commit
    required: true
  project:
    description: Explicit backup project slug
    required: true
  config:
    description: Native fixed exporter and absence-proof declaration
    required: true
runs:
  using: composite
  steps:
    - name: Require reviewed backup automation
      shell: bash
      env:
        TOOLS_REF: ${{ inputs.tools-ref }}
        PROJECT: ${{ inputs.project }}
      run: |
        set -euo pipefail
        [[ "$GITHUB_REF" == refs/heads/main && "$TOOLS_REF" =~ ^[a-f0-9]{40}$ && "$PROJECT" =~ ^[a-z][a-z0-9-]{0,62}$ ]]
        [[ "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
        relation="$(gh api "repos/nicodes/tools/compare/$TOOLS_REF...main" --jq .status)"
        [[ "$relation" == ahead || "$relation" == identical ]]
        printf 'BACKUP_ALLOWED_SLUGS=["%s"]\n' "$PROJECT" >> "$GITHUB_ENV"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: nicodes/tools
        ref: ${{ inputs.tools-ref }}
        path: _backup_cookbook
        persist-credentials: false
    - uses: nicodes/komizo-actions/connect@6aebd7bde3aa5a68efd9c79df0cee3a29beb1be8
      with:
        user: komizo-${{ inputs.project }}
      timeout-minutes: 3
    - name: Prepare private operation authority
      shell: bash
      run: |
        set -euo pipefail
        install -d -m 700 "$RUNNER_TEMP/komizo-backup-proof"
        proof="$RUNNER_TEMP/komizo-backup-proof/operation.frame"
        python3 "$GITHUB_ACTION_PATH/../scripts/backup-proof.py" --output "$proof"
        printf 'KOMIZO_BACKUP_PROOF_FILE=%s\n' "$proof" >> "$GITHUB_ENV"
      timeout-minutes: 2
    - name: Capture verified encrypted backup
      id: capture
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        CONFIG: ${{ inputs.config }}
        TOOLS_ROOT: ${{ github.workspace }}/_backup_cookbook
      run: python3 "$GITHUB_ACTION_PATH/../scripts/backup.py" export --project "$PROJECT" --config "$CONFIG"
      timeout-minutes: 15
    - name: Put the immutable encrypted pair in object storage
      if: steps.capture.outputs.has-export == 'true'
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        TOOLS_ROOT: ${{ github.workspace }}/_backup_cookbook
      run: python3 "$GITHUB_ACTION_PATH/../scripts/backup.py" upload --project "$PROJECT"
      timeout-minutes: 10
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: backup-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/backup/
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 30
      timeout-minutes: 10
    - name: Remove private operation authority
      if: always()
      shell: bash
      run: rm -f "$RUNNER_TEMP/komizo-backup-proof/operation.frame"
      timeout-minutes: 1
