name: Set the running version (deprecated)
description: >
  Renamed to `activate`. This forwards to it unchanged and will be removed.

  The old name described the smallest thing this does — writing APP_VERSION —
  and not the thing it is: the step that runs the deploy on the host, pulls the
  config image, and brings the stack up. It was the only action here that
  changes what is running, and it read like bookkeeping.

  Change `set-version` to `activate` in your workflow. Nothing else moves: the
  inputs, the outputs and the behaviour are the same.

inputs:
  version:
    description: Image tag to make live, normally the commit SHA.
    required: true
  registry:
    description: Registry the host authenticates against before pulling.
    required: false
    # Mirrors activate's default exactly. A shim that restates a default and
    # gets it wrong changes behaviour for every caller who omitted the input,
    # silently, which is worse than not having a shim.
    default: ghcr.io
  registry-user:
    description: Registry username.
    required: false
    default: ""
  registry-token:
    description: Registry password or token.
    required: false
    default: ""
  command:
    description: Privileged deploy command on the host.
    required: true

outputs:
  version:
    description: The version that was deployed. Echoes the input, for chaining.
    value: ${{ steps.fwd.outputs.version }}
  previous-version:
    description: The version that was live before this ran.
    value: ${{ steps.fwd.outputs.previous-version }}

runs:
  using: composite
  steps:
    # A notice rather than a warning: this still does exactly what it did, and
    # a yellow annotation on a working deploy trains people to ignore
    # annotations.
    - name: Say it moved
      shell: bash
      run: |
        echo "::notice::komizo-actions/set-version is now komizo-actions/activate. This forwards for now; update the ref."

    - name: Forward to activate
      id: fwd
      uses: nicodes/komizo-actions/activate@v0
      with:
        version: ${{ inputs.version }}
        registry: ${{ inputs.registry }}
        registry-user: ${{ inputs.registry-user }}
        registry-token: ${{ inputs.registry-token }}
        command: ${{ inputs.command }}
