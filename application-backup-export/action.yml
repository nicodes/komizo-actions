name: Export verified encrypted application backup
description: Credential-free fixed host capture under the caller's original deadline
inputs:
  project:
    description: Native project owning the encrypted capture
    required: true
  config:
    description: Admitted tracked backup declaration
    required: true
outputs:
  has-export:
    description: Verified encrypted pair is available for runner transport
    value: ${{ steps.capture.outputs.has-export }}
runs:
  using: composite
  steps:
    - shell: bash
      id: capture
      env:
        PROJECT: ${{ inputs.project }}
        BACKUP_CONFIG: ${{ inputs.config }}
        TOOLS_ROOT: ${{ env.COOKBOOK_ROOT && env.TOOLS_ROOT || format('{0}/_delivery_cookbook', github.workspace) }}
      run: python3 -I -B "$GITHUB_ACTION_PATH/../scripts/backup.py" export --project "$PROJECT" --config "$BACKUP_CONFIG"
