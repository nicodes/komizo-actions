name: "Inspect service environment"
description: >
  Read a registered application's host-local scoped credential status.
  Sends no secret values. Requires exactly one v2 status line matching the
  explicit profile and expected generation. The host policy decides which
  profile and generation are authorized; its deployment lock rechecks them.

inputs:
  profile:
    description: Opaque profile name installed and approved by the host operator.
    required: true
  app:
    description: >
      Registered application name. Falls back to KOMIZO_APP_NAME. Strictly
      validated before constructing its scoped status executable suffix.
    required: false
    default: ""
  expected-generation:
    description: >
      Opaque generation id, exactly 32 lowercase hex. Nonsecret. Compared
      locally to the status line. Not sent as a status argument.
    required: true

outputs:
  generation:
    description: >
      The generation the status line reported, when it matched
      expected-generation. Empty if the step failed. Not a secret.
    value: ${{ steps.run.outputs.generation }}

runs:
  using: composite
  steps:
    - name: "Inspect service environment"
      id: run
      shell: bash
      env:
        SERVICE_ENV_PROFILE: ${{ inputs.profile }}
        APP: ${{ inputs.app }}
        EXPECTED_GENERATION: ${{ inputs.expected-generation }}
      run: bash "$GITHUB_ACTION_PATH/status.sh"
